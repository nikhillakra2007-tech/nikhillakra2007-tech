<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="hero-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B10" />
      <stop offset="60%" stop-color="#0E131C" />
      <stop offset="100%" stop-color="#141B26" />
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0088FF" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="crimson-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A55" />
      <stop offset="100%" stop-color="#C00E34" />
    </linearGradient>

    <linearGradient id="char-jacket" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1C2330" />
      <stop offset="50%" stop-color="#121720" />
      <stop offset="100%" stop-color="#0A0D12" />
    </linearGradient>

    <linearGradient id="char-skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCECE6" />
      <stop offset="60%" stop-color="#EACBBF" />
      <stop offset="100%" stop-color="#C9A193" />
    </linearGradient>

    <linearGradient id="char-hair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#283244" />
      <stop offset="40%" stop-color="#18202D" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>

    <linearGradient id="hair-highlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0" />
    </linearGradient>

    <!-- Manga Screentone Dot Pattern -->
    <pattern id="manga-dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#1C2533" opacity="0.6" />
    </pattern>

    <!-- Speed Action Lines Pattern -->
    <pattern id="speed-lines" width="40" height="40" patternUnits="userSpaceOnUse">
      <line x1="-10" y1="50" x2="50" y2="-10" stroke="#161E2B" stroke-width="0.8" opacity="0.5" />
    </pattern>

    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-flame" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes flame-pulse {
        0%, 100% { opacity: 0.8; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.05); }
      }
      @keyframes eye-gleam {
        0%, 100% { opacity: 0.85; }
        50% { opacity: 1; filter: drop-shadow(0 0 6px #00E5FF); }
      }
      .flame-aura { animation: flame-pulse 4s ease-in-out infinite; transform-origin: 920px 220px; }
      .eye-core { animation: eye-gleam 2.8s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Base Plate Frame -->
  <rect width="1200" height="450" rx="8" fill="url(#hero-bg)" stroke="#1F2937" stroke-width="1.2" />
  <rect width="1200" height="450" rx="8" fill="url(#manga-dots)" />
  <rect width="1200" height="450" rx="8" fill="url(#speed-lines)" />

  <!-- Diagonal Dynamic Manga Speed Slash (Background) -->
  <polygon points="620,0 720,0 600,450 500,450" fill="#121824" opacity="0.7" />
  <line x1="720" y1="0" x2="600" y2="450" stroke="#00E5FF" stroke-width="1" opacity="0.35" />
  <line x1="620" y1="0" x2="500" y2="450" stroke="#FF2A55" stroke-width="1.2" opacity="0.3" stroke-dasharray="4,6" />

  <!-- Top / Bottom Calibration Lines -->
  <line x1="40" y1="24" x2="1160" y2="24" stroke="#1A222D" stroke-width="1" />
  <line x1="40" y1="426" x2="1160" y2="426" stroke="#1A222D" stroke-width="1" />

  <!-- Corner Brackets -->
  <path d="M 40 36 L 40 24 L 52 24" fill="none" stroke="#00E5FF" stroke-width="1.5" />
  <path d="M 1160 36 L 1160 24 L 1148 24" fill="none" stroke="#00E5FF" stroke-width="1.5" />
  <path d="M 40 414 L 40 426 L 52 426" fill="none" stroke="#00E5FF" stroke-width="1.5" />
  <path d="M 1160 414 L 1160 426 L 1148 426" fill="none" stroke="#00E5FF" stroke-width="1.5" />

  <!-- ================= LEFT COLUMN: HERO IDENTITY & EDITORIAL (60% width) ================= -->
  <g transform="translate(60, 68)">
    <!-- Arc & Series Pill -->
    <g transform="translate(0, 0)">
      <rect width="180" height="24" fill="#131922" stroke="#253244" stroke-width="1" rx="3" />
      <rect width="6" height="24" fill="#00E5FF" rx="2" />
      <text x="16" y="16" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5" font-weight="700" fill="#00E5FF" letter-spacing="1.2">PROTAGONIST ARC // 01</text>
      
      <!-- Japanese Stamp Badge: 限界突破 (Breaking Limits) -->
      <g transform="translate(192, 0)">
        <rect width="90" height="24" fill="#1F1116" stroke="#FF2A55" stroke-width="1" rx="3" />
        <text x="45" y="16.5" font-family="'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif" font-size="10.5" font-weight="700" fill="#FF2A55" text-anchor="middle" letter-spacing="1.5">&#38480;&#30028;&#31361;&#30772;</text>
      </g>
    </g>

    <!-- Main Name Header in High-Impact Typography -->
    <text x="0" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="48" font-weight="900" fill="#F1F3F5" letter-spacing="-1">NIKHIL LAKRA</text>

    <!-- Tagline (Bold Anime Motive) -->
    <g transform="translate(0, 122)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#F1F3F5">
        Building things. <tspan fill="#00E5FF">Breaking limits.</tspan> <tspan fill="#FF2A55">Getting better.</tspan>
      </text>
    </g>

    <!-- Editorial Positioning Line -->
    <text x="0" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#9AA4B2" line-height="1.5">
      <tspan x="0" dy="0">"Turning ambitious ideas into working products &#8212; from the interface</tspan>
      <tspan x="0" dy="22">people use to the intelligent engineering underneath."</tspan>
    </text>

    <!-- Academic & Location Badge -->
    <g transform="translate(0, 222)">
      <rect width="395" height="28" fill="#10151E" stroke="#1D2736" rx="4" />
      <circle cx="14" cy="14" r="3.5" fill="#00E5FF" />
      <text x="26" y="18" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#B9C2CC">
        <tspan fill="#F1F3F5" font-weight="700">CSE '29</tspan> &#183; Manipal University Jaipur &#183; India
      </text>
    </g>

    <!-- Navigation Pills Row -->
    <g transform="translate(0, 272)">
      <!-- Portfolio Pill -->
      <g transform="translate(0, 0)">
        <rect width="115" height="30" fill="#131923" stroke="#00E5FF" stroke-width="1.2" rx="4" />
        <circle cx="14" cy="15" r="3" fill="#00E5FF" />
        <text x="26" y="19" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#F1F3F5">PORTFOLIO</text>
      </g>
      <!-- LinkedIn Pill -->
      <g transform="translate(127, 0)">
        <rect width="100" height="30" fill="#131923" stroke="#253244" stroke-width="1" rx="4" />
        <text x="50" y="19" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" fill="#9AA4B2" text-anchor="middle">LINKEDIN</text>
      </g>
      <!-- GitHub Pill -->
      <g transform="translate(239, 0)">
        <rect width="90" height="30" fill="#131923" stroke="#253244" stroke-width="1" rx="4" />
        <text x="45" y="19" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" fill="#9AA4B2" text-anchor="middle">GITHUB</text>
      </g>
      <!-- Email Pill -->
      <g transform="translate(341, 0)">
        <rect width="90" height="30" fill="#131923" stroke="#253244" stroke-width="1" rx="4" />
        <text x="45" y="19" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" fill="#9AA4B2" text-anchor="middle">CONTACT</text>
      </g>
    </g>
  </g>

  <!-- ================= RIGHT COLUMN: ORIGINAL ANIME PROTAGONIST ARTWORK (40% width) ================= -->
  <!-- Framing: Dynamic Diagonal Manga Panel Card -->
  <g transform="translate(740, 30)">
    <!-- Manga Panel Outer Shadow / Accent Box -->
    <polygon points="40,15 390,15 350,385 0,385" fill="#0A0D13" stroke="#222C3D" stroke-width="1.5" />
    
    <!-- Manga Panel Accent Borders -->
    <line x1="40" y1="15" x2="390" y2="15" stroke="#00E5FF" stroke-width="2" />
    <line x1="390" y1="15" x2="350" y2="385" stroke="#222C3D" stroke-width="1.5" />
    <line x1="350" y1="385" x2="0" y2="385" stroke="#FF2A55" stroke-width="2" />
    <line x1="0" y1="385" x2="40" y2="15" stroke="#222C3D" stroke-width="1.5" />

    <!-- Action Speed Screentone Inside Panel -->
    <g opacity="0.6">
      <line x1="60" y1="40" x2="360" y2="40" stroke="#1B2433" stroke-width="1" stroke-dasharray="2,6" />
      <line x1="50" y1="80" x2="350" y2="80" stroke="#1B2433" stroke-width="1" stroke-dasharray="4,8" />
      <line x1="30" y1="320" x2="330" y2="320" stroke="#1B2433" stroke-width="1" stroke-dasharray="3,6" />
      <line x1="20" y1="350" x2="320" y2="350" stroke="#1B2433" stroke-width="1" stroke-dasharray="2,4" />
    </g>

    <!-- Aura Glow Behind Character -->
    <ellipse class="flame-aura" cx="190" cy="200" rx="100" ry="130" fill="url(#cyan-glow)" filter="url(#glow-flame)" opacity="0.4" />

    <!-- CHARACTER VECTOR ARTWORK: THE DETERMINED BUILDER -->
    <g transform="translate(190, 195)">
      <!-- Shoulders & High-Collar Tech Jacket -->
      <!-- Back Jacket Base -->
      <path d="M -115 175 L -95 95 L -45 55 L 45 55 L 95 95 L 115 175 Z" fill="url(#char-jacket)" stroke="#2D3A4D" stroke-width="1.5" />

      <!-- High-Collar Flaps (Upright Anime Collar) -->
      <path d="M -55 58 L -38 10 L -22 45 Z" fill="#151C26" stroke="#37475E" stroke-width="1.2" />
      <path d="M 55 58 L 38 10 L 22 45 Z" fill="#18212D" stroke="#37475E" stroke-width="1.2" />

      <!-- Glowing Cyan Collar Seamlines -->
      <line x1="-50" y1="60" x2="-35" y2="20" stroke="#00E5FF" stroke-width="1.5" filter="url(#glow-cyan)" />
      <line x1="50" y1="60" x2="35" y2="20" stroke="#00E5FF" stroke-width="1.5" filter="url(#glow-cyan)" />

      <!-- Chest / Inner Shirt -->
      <polygon points="-25,48 0,75 25,48 0,35" fill="#090C10" stroke="#1F2836" stroke-width="1" />
      <line x1="0" y1="42" x2="0" y2="72" stroke="#FF2A55" stroke-width="1.5" />

      <!-- Neck & Throat -->
      <path d="M -18 35 L -16 -5 L 16 -5 L 18 35 Z" fill="url(#char-skin)" />
      <!-- Neck Shadow / Cel Shading -->
      <path d="M -16 5 L 0 25 L 16 5 L 18 35 L -18 35 Z" fill="#B38A7D" opacity="0.6" />

      <!-- Jaw & Head Structure -->
      <!-- Head Base (Chiseled, angular anime chin) -->
      <polygon points="-38,-25 -42,-45 -25,-85 25,-85 42,-45 38,-25 0,12" fill="url(#char-skin)" stroke="#9F776B" stroke-width="0.8" />
      <!-- Left & Right Jaw Cel Shadow -->
      <polygon points="-38,-25 -25,-10 0,12 -15,5 -38,-15" fill="#B38A7D" opacity="0.5" />
      <polygon points="38,-25 25,-10 0,12 15,5 38,-15" fill="#C9A193" opacity="0.4" />

      <!-- Ears -->
      <polygon points="-42,-42 -48,-35 -40,-20 -38,-25" fill="#D8B1A4" stroke="#9F776B" stroke-width="0.8" />
      <polygon points="42,-42 48,-35 40,-20 38,-25" fill="#D8B1A4" stroke="#9F776B" stroke-width="0.8" />

      <!-- Mouth & Expression (Determined, calm, slight focus smirk) -->
      <path d="M -10 -5 Q 0 -2 10 -6" fill="none" stroke="#684A42" stroke-width="2" stroke-linecap="round" />
      <line x1="-3" y1="1" x2="5" y2="0" stroke="#9E766A" stroke-width="1" />

      <!-- Nose (Sharp Anime Minimalist) -->
      <path d="M 0 -22 L 2 -14 L -2 -14" fill="#886055" />

      <!-- Focused Anime Eyes (Blue Lock / Haikyuu Determination) -->
      <!-- Left Eye -->
      <g transform="translate(-18, -28)">
        <!-- Brow Line (Intense forward lean) -->
        <path d="M -16 -4 L 6 -9 L 8 -7" fill="none" stroke="#141B26" stroke-width="2.5" stroke-linecap="round" />
        <!-- Upper Eyelid -->
        <path d="M -14 -1 L 5 -5" fill="none" stroke="#121822" stroke-width="2.2" />
        <!-- Sclera -->
        <polygon points="-12,-1 4,-5 2,3 -10,4" fill="#FFFFFF" />
        <!-- Cyan Iris & Pupil -->
        <circle class="eye-core" cx="-3" cy="0" r="4.2" fill="#00E5FF" filter="url(#glow-cyan)" />
        <circle cx="-3" cy="0" r="2.2" fill="#0A1826" />
        <circle cx="-4" cy="-1.5" r="1.2" fill="#FFFFFF" />
        <!-- Lower Eyelid -->
        <path d="M -10 5 L 2 4" fill="none" stroke="#121822" stroke-width="1.2" />
      </g>

      <!-- Right Eye -->
      <g transform="translate(18, -28)">
        <!-- Brow Line -->
        <path d="M -8 -7 L -6 -9 L 16 -4" fill="none" stroke="#141B26" stroke-width="2.5" stroke-linecap="round" />
        <!-- Upper Eyelid -->
        <path d="M -5 -5 L 14 -1" fill="none" stroke="#121822" stroke-width="2.2" />
        <!-- Sclera -->
        <polygon points="-4,-5 12,-1 10,4 -2,3" fill="#FFFFFF" />
        <!-- Cyan Iris & Pupil -->
        <circle class="eye-core" cx="3" cy="0" r="4.2" fill="#00E5FF" filter="url(#glow-cyan)" />
        <circle cx="3" cy="0" r="2.2" fill="#0A1826" />
        <circle cx="2" cy="-1.5" r="1.2" fill="#FFFFFF" />
        <!-- Lower Eyelid -->
        <path d="M -2 4 L 10 5" fill="none" stroke="#121822" stroke-width="1.2" />
      </g>

      <!-- Windswept Anime Hair (Sharp, layered geometric locks) -->
      <!-- Back Hair Layer -->
      <path d="M -55 -40 L -62 -70 L -45 -95 L 0 -115 L 45 -95 L 62 -70 L 55 -40 Z" fill="#0D1117" />
      
      <!-- Main Hair Crown & Swept Strands -->
      <path d="M -48 -60 L -65 -85 L -35 -80 L -45 -110 L -15 -95 L 0 -120 L 18 -98 L 48 -112 L 35 -82 L 65 -88 L 48 -58 Z" fill="url(#char-hair)" stroke="#1F2838" stroke-width="1" />
      
      <!-- Forehead Bangs & Forward Locks -->
      <polygon points="-32,-65 -22,-35 -15,-58" fill="#151C28" />
      <polygon points="-18,-62 -8,-32 -2,-55" fill="#1C2534" />
      <polygon points="-4,-58 6,-28 12,-55" fill="#121822" />
      <polygon points="10,-60 22,-36 28,-62" fill="#182230" />
      
      <!-- Cyan Edge Rim Light On Hair -->
      <path d="M -65 -85 L -45 -110 L 0 -120 L 48 -112 L 65 -88" fill="none" stroke="url(#hair-highlight)" stroke-width="2" filter="url(#glow-cyan)" />

      <!-- Energy Spars / Motivation Particles -->
      <circle cx="-55" cy="-90" r="1.5" fill="#00E5FF" />
      <circle cx="60" cy="-75" r="2" fill="#FF2A55" />
      <circle cx="-75" cy="40" r="1.5" fill="#00E5FF" />
      <circle cx="85" cy="20" r="1.8" fill="#00E5FF" />
      <polygon points="70,-10 74,-6 70,-2 66,-6" fill="#00E5FF" opacity="0.8" />
      <polygon points="-70,-20 -66,-16 -70,-12 -74,-16" fill="#FF2A55" opacity="0.8" />
    </g>

    <!-- Japanese Editorial Caption Watermark (Bottom of Manga Panel) -->
    <g transform="translate(45, 345)">
      <rect width="180" height="24" fill="#0A0F17" stroke="#1E2838" rx="2" />
      <text x="12" y="16" font-family="'JetBrains Mono', Consolas, monospace" font-size="8.5" font-weight="700" fill="#00E5FF" letter-spacing="1">PROTAGONIST // NIKHIL</text>
      <text x="168" y="16" font-family="'Noto Sans JP', sans-serif" font-size="9" fill="#9AA4B2" text-anchor="end">&#36914;&#21270;&#20013;</text> <!-- 進化中 = Evolving / Leveling Up -->
    </g>
  </g>
</svg>