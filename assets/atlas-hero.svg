<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background & Palette -->
    <linearGradient id="atlasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1014" />
      <stop offset="50%" stop-color="#12151b" />
      <stop offset="100%" stop-color="#0a0c0f" />
    </linearGradient>

    <!-- Blueprint Technical Grid -->
    <pattern id="atlasGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#85888E" stroke-width="0.35" stroke-opacity="0.25" />
      <circle cx="0" cy="0" r="0.75" fill="#2457FF" fill-opacity="0.3" />
    </pattern>

    <!-- Accent Gradients -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2457FF" />
      <stop offset="100%" stop-color="#4e7aff" />
    </linearGradient>

    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F05A28" />
      <stop offset="100%" stop-color="#ff794d" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "SF Mono", Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .hero-name { font-size: 64px; font-weight: 900; letter-spacing: -0.035em; fill: #F2F0E9; }
    .plate-num { font-size: 10px; font-weight: 700; fill: #F05A28; letter-spacing: 0.22em; text-transform: uppercase; }
    .atlas-label { font-size: 10px; font-weight: 600; fill: #85888E; letter-spacing: 0.16em; text-transform: uppercase; }
    .positioning { font-size: 17px; font-weight: 400; fill: #F2F0E9; line-height: 1.5; letter-spacing: -0.01em; }
    .identity-meta { font-size: 11px; font-weight: 500; fill: #85888E; letter-spacing: 0.08em; }
    .schem-txt { font-size: 9px; font-weight: 600; fill: #F2F0E9; letter-spacing: 0.06em; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#atlasBg)" />
  <rect width="1200" height="420" fill="url(#atlasGrid)" />

  <!-- Outer Architectural Drafting Frame -->
  <rect x="20" y="20" width="1160" height="380" fill="none" stroke="#85888E" stroke-width="0.8" stroke-opacity="0.4" />
  
  <!-- Outer Dimension Tick Marks -->
  <g stroke="#85888E" stroke-width="0.8" opacity="0.6">
    <!-- Top ticks -->
    <line x1="20" y1="12" x2="20" y2="28" />
    <line x1="1180" y1="12" x2="1180" y2="28" />
    <line x1="20" y1="12" x2="1180" y2="12" stroke-dasharray="4 4" />
    <!-- Bottom ticks -->
    <line x1="20" y1="392" x2="20" y2="408" />
    <line x1="1180" y1="392" x2="1180" y2="408" />
  </g>
  <text x="600" y="10" text-anchor="middle" class="mono atlas-label" font-size="8">DIMENSION: 1160.00 MM // SCALE 1:1</text>

  <!-- Top Title Block / Masthead -->
  <g transform="translate(48, 52)" class="mono">
    <text x="0" y="0" class="plate-num">THE ENGINEERING ATLAS // SHEET 001</text>
    <text x="1104" y="0" text-anchor="end" class="atlas-label">FIELD REGISTRY: 26.9124° N · 75.7873° E [INDIA]</text>
    <line x1="0" y1="14" x2="1104" y2="14" stroke="#85888E" stroke-width="0.6" stroke-opacity="0.3" />
  </g>

  <!-- Left Column: Asymmetrical Typographic Hero -->
  <g transform="translate(48, 105)">
    <!-- Architectural Identification Badge -->
    <rect x="0" y="0" width="170" height="22" fill="#2457FF" fill-opacity="0.15" stroke="#2457FF" stroke-width="0.8" />
    <circle cx="10" cy="11" r="3" fill="#F05A28" />
    <text x="22" y="15" class="mono" font-size="10" font-weight="700" fill="#2457FF" letter-spacing="0.15em">SYSTEMS ARCHITECT</text>

    <!-- Dominant Name -->
    <text x="0" y="80" class="sans hero-name">NIKHIL LAKRA</text>

    <!-- Positioning Statement -->
    <g transform="translate(0, 115)">
      <text x="0" y="0" class="sans positioning">"I build complete systems — from product interfaces</text>
      <text x="0" y="26" class="sans positioning">to the infrastructure and logic beneath them."</text>
    </g>

    <!-- Identity & Institutional Credentials -->
    <g transform="translate(0, 195)" class="mono identity-meta">
      <text x="0" y="0" fill="#F05A28" font-weight="700">DISCIPLINE:</text>
      <text x="80" y="0" fill="#F2F0E9">Computer Science Engineering</text>
      
      <text x="0" y="20" fill="#2457FF" font-weight="700">ACADEMIA:</text>
      <text x="80" y="20" fill="#F2F0E9">Manipal University Jaipur · Class of 2029</text>
      
      <text x="0" y="40" fill="#85888E" font-weight="700">LOCATION:</text>
      <text x="80" y="40" fill="#85888E">Jaipur, Rajasthan, India</text>
    </g>
  </g>

  <!-- Right Column: Abstract Interconnected Systems Architectural Schematic -->
  <g transform="translate(670, 95)">
    <!-- Schematic Frame -->
    <rect x="0" y="0" width="480" height="270" fill="#101216" stroke="#85888E" stroke-width="0.7" stroke-opacity="0.5" />
    <rect x="0" y="0" width="480" height="24" fill="#161a22" />
    <text x="14" y="16" class="mono atlas-label" font-size="9" fill="#F2F0E9">SYSTEM TOPOLOGY // SCHEMATIC INTERCONNECTION</text>
    <circle cx="462" cy="12" r="3" fill="#F05A28" />

    <!-- Isometric Layer 1: Invariant Accounting Node -->
    <g transform="translate(30, 48)">
      <rect width="190" height="70" fill="#141820" stroke="#2457FF" stroke-width="0.8" />
      <rect width="190" height="18" fill="#2457FF" fill-opacity="0.2" />
      <text x="8" y="13" class="mono schem-txt" fill="#2457FF">01 · INVARIANT ACCOUNTING</text>
      <text x="8" y="36" class="sans" font-size="11" fill="#F2F0E9" font-weight="600">FINROQ Core Engine</text>
      <text x="8" y="52" class="mono" font-size="9.5" fill="#85888E">Python Decimal · Zero Float Drift</text>
      <!-- Port Indicator -->
      <circle cx="190" cy="35" r="3" fill="#2457FF" />
    </g>

    <!-- Isometric Layer 2: Spatial Hydrology Node -->
    <g transform="translate(260, 48)">
      <rect width="190" height="70" fill="#141820" stroke="#F05A28" stroke-width="0.8" />
      <rect width="190" height="18" fill="#F05A28" fill-opacity="0.2" />
      <text x="8" y="13" class="mono schem-txt" fill="#F05A28">02 · SPATIAL HYDROLOGY</text>
      <text x="8" y="36" class="sans" font-size="11" fill="#F2F0E9" font-weight="600">FloodLens Cloud Mesh</text>
      <text x="8" y="52" class="mono" font-size="9.5" fill="#85888E">PostGIS · AWS Lambda DEM</text>
      <!-- Port Indicator -->
      <circle cx="260" cy="35" r="3" fill="#F05A28" />
    </g>

    <!-- Bus Routing Lines -->
    <path d="M 220 83 L 240 83 L 240 145 L 240 160" fill="none" stroke="#2457FF" stroke-width="1.2" stroke-dasharray="3 2" />
    <path d="M 260 83 L 240 83" fill="none" stroke="#F05A28" stroke-width="1.2" />

    <!-- Isometric Layer 3: Software Verification Gate Node -->
    <g transform="translate(110, 160)">
      <rect width="260" height="85" fill="#181d28" stroke="#85888E" stroke-width="1" />
      <rect width="260" height="18" fill="#85888E" fill-opacity="0.2" />
      <text x="8" y="13" class="mono schem-txt" fill="#F2F0E9">03 · AUTONOMOUS VERIFICATION</text>
      <text x="8" y="38" class="sans" font-size="12" fill="#F2F0E9" font-weight="700">ProofStack DevSecOps</text>
      <text x="8" y="54" class="mono" font-size="10" fill="#F05A28">8 Compiler AST Gates · MicroVM DAST</text>
      <text x="8" y="70" class="mono" font-size="9" fill="#85888E">HMAC-SHA256 Append-Only Merkle Ledger</text>
    </g>

    <!-- Dimension Crosshair in schematic -->
    <line x1="390" y1="210" x2="450" y2="210" stroke="#2457FF" stroke-width="0.8" />
    <line x1="420" y1="180" x2="420" y2="240" stroke="#2457FF" stroke-width="0.8" />
    <circle cx="420" cy="210" r="14" fill="none" stroke="#2457FF" stroke-width="0.6" stroke-dasharray="2 2" />
  </g>

  <!-- Bottom Coordinates Baseline -->
  <g transform="translate(48, 385)" class="mono atlas-label" font-size="8.5">
    <text x="0" y="0">DOC REF: ATLAS-2026-NL-01</text>
    <text x="400" y="0">ARCHITECTURAL TAXONOMY: DISTRIBUTED SYSTEMS &amp; AUTONOMOUS AGENTS</text>
    <text x="1104" y="0" text-anchor="end">STATUS: ACTIVE COMPILATION</text>
  </g>
</svg>

