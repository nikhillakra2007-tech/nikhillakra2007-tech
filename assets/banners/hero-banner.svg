<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06050b" />
      <stop offset="45%" stop-color="#0c0919" />
      <stop offset="100%" stop-color="#040308" />
    </linearGradient>

    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="crimsonAura" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff0055" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="shadowFlames" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.7" />
      <stop offset="40%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06050b" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.02" />
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.3" />
    </linearGradient>

    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(168, 85, 247, 0.08)" stroke-width="1" />
    </pattern>

    <!-- Filters for Glow Effects -->
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseAura {
      0%, 100% { opacity: 0.55; transform: scale(1); }
      50% { opacity: 0.9; transform: scale(1.03); }
    }
    @keyframes scanlineAnim {
      0% { transform: translateY(-380px); }
      100% { transform: translateY(380px); }
    }
    @keyframes flickerGlow {
      0%, 100% { opacity: 0.95; }
      45% { opacity: 0.9; }
      50% { opacity: 0.75; }
      55% { opacity: 0.98; }
      80% { opacity: 0.85; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-25px) translateX(10px); opacity: 0.8; }
      100% { transform: translateY(-50px) translateX(-5px); opacity: 0; }
    }
    @keyframes glitchText {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(-2px, 1px); }
      40% { transform: translate(2px, -1px); }
      60% { transform: translate(-1px, -1px); }
      80% { transform: translate(1px, 2px); }
    }
    .glitch-title {
      font-family: 'SF Pro Display', 'Inter', -apple-system, system-ui, sans-serif;
      font-weight: 900;
      letter-spacing: 5px;
      animation: flickerGlow 4s infinite ease-in-out;
    }
    .aura-bg {
      animation: pulseAura 5s infinite ease-in-out;
      transform-origin: 460px 190px;
    }
    .hud-mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace;
    }
    .kanji-text {
      font-family: 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif;
      font-weight: 700;
    }
  </style>

  <!-- Background Base -->
  <rect width="920" height="380" fill="url(#bgGrad)" rx="16" />

  <!-- Cyber Grid -->
  <rect width="920" height="380" fill="url(#cyberGrid)" rx="16" />

  <!-- Shadow Monarch Rising Energy Aura -->
  <circle cx="460" cy="220" r="260" fill="url(#shadowFlames)" class="aura-bg" filter="url(#glowPurple)" />
  <circle cx="780" cy="80" r="140" fill="url(#crimsonAura)" filter="url(#glowPurple)" />
  <circle cx="120" cy="300" r="180" fill="url(#shadowFlames)" filter="url(#glowPurple)" />

  <!-- Cyberpunk Perspective Grid (Ground Horizon) -->
  <g opacity="0.35">
    <line x1="0" y1="330" x2="920" y2="330" stroke="#a855f7" stroke-width="1" />
    <line x1="0" y1="345" x2="920" y2="345" stroke="#a855f7" stroke-width="1.2" />
    <line x1="0" y1="362" x2="920" y2="362" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="0" y1="378" x2="920" y2="378" stroke="#38bdf8" stroke-width="2" />
    
    <!-- Vanishing rays -->
    <line x1="460" y1="315" x2="60" y2="380" stroke="#a855f7" stroke-width="1" />
    <line x1="460" y1="315" x2="220" y2="380" stroke="#a855f7" stroke-width="1" />
    <line x1="460" y1="315" x2="360" y2="380" stroke="#a855f7" stroke-width="1" />
    <line x1="460" y1="315" x2="560" y2="380" stroke="#a855f7" stroke-width="1" />
    <line x1="460" y1="315" x2="700" y2="380" stroke="#a855f7" stroke-width="1" />
    <line x1="460" y1="315" x2="860" y2="380" stroke="#a855f7" stroke-width="1" />
  </g>

  <!-- Distant Cyberpunk Skyline Silhouettes -->
  <g fill="#090812" opacity="0.75">
    <rect x="70" y="240" width="30" height="90" />
    <rect x="105" y="210" width="45" height="120" />
    <rect x="155" y="255" width="25" height="75" />
    <rect x="185" y="225" width="50" height="105" />
    <!-- Spire -->
    <line x1="127" y1="190" x2="127" y2="210" stroke="#ff0055" stroke-width="1.5" />
    <circle cx="127" cy="190" r="2" fill="#ff0055" />

    <rect x="680" y="235" width="35" height="95" />
    <rect x="720" y="200" width="55" height="130" />
    <rect x="780" y="245" width="40" height="85" />
    <rect x="825" y="220" width="30" height="110" />
    <!-- Spire -->
    <line x1="747" y1="175" x2="747" y2="200" stroke="#00f5ff" stroke-width="1.5" />
    <circle cx="747" cy="175" r="2" fill="#00f5ff" />
  </g>

  <!-- High-Tech HUD Top Bar & Brackets -->
  <g class="hud-mono" font-size="11" fill="#a855f7">
    <!-- Top Left Corner Bracket -->
    <path d="M 30 50 L 30 30 L 70 30" fill="none" stroke="#a855f7" stroke-width="2" />
    <rect x="75" y="28" width="5" height="5" fill="#38bdf8" />
    <text x="90" y="34" fill="#38bdf8" letter-spacing="2">SYS_ID: NL-07 // SHADOW_CORP</text>

    <!-- Top Right Corner Bracket -->
    <path d="M 890 50 L 890 30 L 850 30" fill="none" stroke="#a855f7" stroke-width="2" />
    <text x="835" y="34" text-anchor="end" fill="#ff0055" letter-spacing="1">CLASSIFICATION: SPECIAL GRADE</text>
    <circle cx="848" cy="30" r="3" fill="#ff0055" />
  </g>

  <!-- Japanese Kanji Watermark & Accents -->
  <g class="kanji-text" opacity="0.12" fill="#c084fc">
    <text x="460" y="140" font-size="100" text-anchor="middle" font-weight="900" letter-spacing="30">領域展開</text>
  </g>

  <!-- Floating Digital Embers / Cursed Energy Particles -->
  <g fill="#c084fc">
    <circle cx="210" cy="180" r="1.5" opacity="0.8" style="animation: floatParticle 3s infinite ease-in-out;" />
    <circle cx="270" cy="130" r="2.2" opacity="0.6" style="animation: floatParticle 4s infinite ease-in-out 1s;" />
    <circle cx="680" cy="160" r="1.8" opacity="0.7" style="animation: floatParticle 3.5s infinite ease-in-out 0.5s;" />
    <circle cx="730" cy="210" r="2.5" opacity="0.5" style="animation: floatParticle 4.5s infinite ease-in-out 2s;" />
    <circle cx="440" cy="90" r="1.2" opacity="0.9" style="animation: floatParticle 2.5s infinite ease-in-out 1.5s;" />
    <circle cx="510" cy="110" r="2" opacity="0.7" style="animation: floatParticle 3.8s infinite ease-in-out 0.8s;" />
  </g>

  <!-- Main Hero Title Section -->
  <g text-anchor="middle">
    <!-- Subtitle Badge Pill -->
    <rect x="330" y="75" width="260" height="26" rx="13" fill="#17122b" stroke="#a855f7" stroke-width="1.2" opacity="0.9" />
    <text x="460" y="92" class="hud-mono" font-size="11" font-weight="700" fill="#c084fc" letter-spacing="3">
      ◆ 影の君主 · SHADOW MONARCH ◆
    </text>

    <!-- Main Name Header: NIKHIL LAKRA -->
    <text x="460" y="165" class="glitch-title" font-size="64" fill="#ffffff" filter="url(#subtleGlow)">
      NIKHIL LAKRA
    </text>

    <!-- Kanji Sub-Header -->
    <text x="460" y="195" class="kanji-text" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="8" opacity="0.9">
      ニキル・ラクラ // システムアーキテクト
    </text>

    <!-- Glowing Slogan Bar -->
    <line x1="280" y1="215" x2="640" y2="215" stroke="url(#neonPurple)" stroke-width="1.5" />
    <polygon points="460,212 464,215 460,218 456,215" fill="#38bdf8" />

    <!-- Developer Creed / Tagline -->
    <text x="460" y="244" class="hud-mono" font-size="15" font-weight="600" fill="#f8fafc" letter-spacing="2">
      "Building intelligent systems. Engineering the impossible."
    </text>

    <!-- Status Telemetry Bar -->
    <rect x="180" y="272" width="560" height="34" rx="8" fill="#0d0a1a" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1" />
    <g class="hud-mono" font-size="11" fill="#e2e8f0">
      <circle cx="205" cy="289" r="4" fill="#22c55e">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="220" y="293" text-anchor="start" fill="#4ade80" font-weight="700">ONLINE</text>
      <text x="280" y="293" text-anchor="start" fill="#94a3b8">|</text>
      <text x="295" y="293" text-anchor="start" fill="#c084fc">MANIPAL UNIV JAIPUR '29</text>
      <text x="465" y="293" text-anchor="start" fill="#94a3b8">|</text>
      <text x="480" y="293" text-anchor="start" fill="#38bdf8">CORE: AI &amp; AGENTIC SYSTEMS</text>
    </g>
  </g>

  <!-- Bottom Corner Brackets & Diagnostics -->
  <g class="hud-mono" font-size="10" fill="#64748b">
    <path d="M 30 330 L 30 350 L 70 350" fill="none" stroke="#a855f7" stroke-width="2" />
    <text x="40" y="365">LATENCY: &lt;150ms</text>
    
    <path d="M 890 330 L 890 350 L 850 350" fill="none" stroke="#a855f7" stroke-width="2" />
    <text x="880" y="365" text-anchor="end">DETERMINISTIC GATES: 8/8</text>
  </g>

  <!-- Subtle Outer Border Frame -->
  <rect x="2" y="2" width="916" height="376" rx="15" fill="none" stroke="rgba(168, 85, 247, 0.35)" stroke-width="1.5" />
</svg>

