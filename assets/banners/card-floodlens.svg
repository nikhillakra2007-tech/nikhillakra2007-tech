<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 140" width="100%" height="100%">
  <defs>
    <linearGradient id="floodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1a17" />
      <stop offset="60%" stop-color="#071412" />
      <stop offset="100%" stop-color="#030a09" />
    </linearGradient>
    <linearGradient id="floodGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <style>
    .card-title { font-family: 'Inter', -apple-system, sans-serif; font-weight: 800; font-size: 22px; fill: #ffffff; }
    .card-sub { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; fill: #94a3b8; }
    .card-tag { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 11px; font-weight: 700; fill: #34d399; letter-spacing: 1.5px; }
    .btn-text { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 700; fill: #ffffff; letter-spacing: 1px; }
  </style>

  <!-- Card Background -->
  <rect width="880" height="140" rx="14" fill="url(#floodGrad)" stroke="rgba(16, 185, 129, 0.45)" stroke-width="1.5" />
  
  <!-- Left Accent Bar -->
  <rect x="0" y="0" width="6" height="140" rx="3" fill="url(#floodGlow)" />

  <!-- Wave / Water Radar Icon -->
  <g transform="translate(35, 38)">
    <polygon points="28,4 52,18 52,46 28,60 4,46 4,18" fill="#0c231f" stroke="#10b981" stroke-width="1.8" />
    <path d="M 16 34 Q 22 26 28 34 Q 34 42 40 34" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Project Info -->
  <text x="110" y="44" class="card-tag">GEOSPATIAL HYDROLOGY &amp; CLOUD SYSTEMS</text>
  <text x="110" y="74" class="card-title">FloodLens</text>
  <text x="110" y="102" class="card-sub">Evidence-driven urban hydrology platform modeling counterfactual stormwater infrastructure interventions.</text>

  <!-- Badges / Indicators -->
  <g transform="translate(680, 48)">
    <rect width="165" height="30" rx="6" fill="#0d2621" stroke="#10b981" stroke-width="1" />
    <circle cx="16" cy="15" r="4" fill="#10b981" />
    <text x="28" y="19" class="btn-text">AWS HACKATHON 27/30</text>
  </g>
</svg>
