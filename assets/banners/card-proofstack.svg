<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 140" width="100%" height="100%">
  <defs>
    <linearGradient id="psGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140a28" />
      <stop offset="60%" stop-color="#0c071a" />
      <stop offset="100%" stop-color="#06030c" />
    </linearGradient>
    <linearGradient id="psGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#00f5ff" />
    </linearGradient>
  </defs>

  <style>
    .card-title { font-family: 'Inter', -apple-system, sans-serif; font-weight: 800; font-size: 22px; fill: #ffffff; }
    .card-sub { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; fill: #94a3b8; }
    .card-tag { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 11px; font-weight: 700; fill: #c084fc; letter-spacing: 1.5px; }
    .btn-text { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 700; fill: #ffffff; letter-spacing: 1px; }
  </style>

  <!-- Card Background -->
  <rect width="880" height="140" rx="14" fill="url(#psGrad)" stroke="rgba(168, 85, 247, 0.45)" stroke-width="1.5" />
  
  <!-- Left Accent Bar -->
  <rect x="0" y="0" width="6" height="140" rx="3" fill="url(#psGlow)" />

  <!-- Shield / Lock Hexagon Icon -->
  <g transform="translate(35, 38)">
    <polygon points="28,4 52,18 52,46 28,60 4,46 4,18" fill="#1b1236" stroke="#a855f7" stroke-width="1.8" />
    <circle cx="28" cy="32" r="8" fill="none" stroke="#00f5ff" stroke-width="2" />
    <line x1="28" y1="36" x2="28" y2="44" stroke="#00f5ff" stroke-width="2" />
  </g>

  <!-- Project Info -->
  <text x="110" y="44" class="card-tag">DEVSECOPS &amp; CODE REPAIR</text>
  <text x="110" y="74" class="card-title">ProofStack</text>
  <text x="110" y="102" class="card-sub">Autonomous code repair engine with 8 compiler AST gates, microVM DAST, and HMAC Merkle ledger.</text>

  <!-- Badges / Indicators -->
  <g transform="translate(680, 48)">
    <rect width="165" height="30" rx="6" fill="#170f2e" stroke="#a855f7" stroke-width="1" />
    <circle cx="16" cy="15" r="4" fill="#22c55e" />
    <text x="28" y="19" class="btn-text">8 COMPILER GATES</text>
  </g>
</svg>
