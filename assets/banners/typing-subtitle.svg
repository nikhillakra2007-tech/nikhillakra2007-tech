<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 70" width="100%" height="70">
  <defs>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
  </defs>

  <style>
    .terminal-box {
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace;
      font-size: 18px;
      font-weight: 700;
    }
    
    .cursor {
      animation: blink 0.9s infinite;
      fill: #a855f7;
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    /* 5 Rotating Roles animation sequence (15s total loop) */
    @keyframes cycleRole1 {
      0%, 18% { opacity: 1; }
      20%, 100% { opacity: 0; }
    }
    @keyframes cycleRole2 {
      0%, 19% { opacity: 0; }
      21%, 38% { opacity: 1; }
      40%, 100% { opacity: 0; }
    }
    @keyframes cycleRole3 {
      0%, 39% { opacity: 0; }
      41%, 58% { opacity: 1; }
      60%, 100% { opacity: 0; }
    }
    @keyframes cycleRole4 {
      0%, 59% { opacity: 0; }
      61%, 78% { opacity: 1; }
      80%, 100% { opacity: 0; }
    }
    @keyframes cycleRole5 {
      0%, 79% { opacity: 0; }
      81%, 98% { opacity: 1; }
      100% { opacity: 0; }
    }

    .role-1 { animation: cycleRole1 15s infinite; }
    .role-2 { animation: cycleRole2 15s infinite; }
    .role-3 { animation: cycleRole3 15s infinite; }
    .role-4 { animation: cycleRole4 15s infinite; }
    .role-5 { animation: cycleRole5 15s infinite; }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="846" height="66" rx="12" fill="#0c0a17" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1.5" />
  
  <!-- Terminal Prompt prefix -->
  <g class="terminal-box">
    <text x="24" y="41" fill="#a855f7">&gt;</text>
    <text x="44" y="41" fill="#64748b">CLASS:</text>

    <!-- Role 1 -->
    <g class="role-1">
      <text x="120" y="41" fill="url(#textGrad)">Full-Stack Developer &amp; Systems Builder</text>
      <rect x="525" y="23" width="10" height="22" class="cursor" />
    </g>

    <!-- Role 2 -->
    <g class="role-2">
      <text x="120" y="41" fill="url(#textGrad)">AI &amp; Agentic Systems Engineer</text>
      <rect x="460" y="23" width="10" height="22" class="cursor" />
    </g>

    <!-- Role 3 -->
    <g class="role-3">
      <text x="120" y="41" fill="url(#textGrad)">Autonomous DevSecOps Architect</text>
      <rect x="470" y="23" width="10" height="22" class="cursor" />
    </g>

    <!-- Role 4 -->
    <g class="role-4">
      <text x="120" y="41" fill="url(#textGrad)">Low-Latency Telemetry &amp; Core Backend</text>
      <rect x="520" y="23" width="10" height="22" class="cursor" />
    </g>

    <!-- Role 5 -->
    <g class="role-5">
      <text x="120" y="41" fill="url(#textGrad)">Competitive Hackathon Winner (AWS × 27/30)</text>
      <rect x="560" y="23" width="10" height="22" class="cursor" />
    </g>
  </g>
</svg>

