<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="100%">
  <defs>
    <pattern id="fin-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#22262E" stroke-width="0.7" opacity="0.4" />
    </pattern>
    <linearGradient id="fin-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2457FF" />
      <stop offset="100%" stop-color="#F05A28" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1000" height="280" fill="#101216" />
  <rect width="1000" height="280" fill="url(#fin-grid)" />
  <rect x="16" y="16" width="968" height="248" fill="none" stroke="#262B35" stroke-width="1" />

  <!-- Corner registration ticks -->
  <path d="M 10 24 L 22 24 M 16 18 L 16 30" stroke="#85888E" stroke-width="1.2" />
  <path d="M 978 24 L 990 24 M 984 18 L 984 30" stroke="#85888E" stroke-width="1.2" />
  <path d="M 10 256 L 22 256 M 16 250 L 16 262" stroke="#85888E" stroke-width="1.2" />
  <path d="M 978 256 L 990 256 M 984 250 L 984 262" stroke="#85888E" stroke-width="1.2" />

  <!-- Technical Header -->
  <g transform="translate(36, 40)">
    <text font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#2457FF" letter-spacing="1.5">FIELD SHEET 01 // FINANCIAL PRECISION</text>
    <text x="520" font-family="'JetBrains Mono', monospace" font-size="9" fill="#85888E" letter-spacing="1">SYSTEM: FINROQ-CORE // ARBITRARY PRECISION ENGINE</text>
    <line x1="0" y1="12" x2="928" y2="12" stroke="#262B35" stroke-width="1" />
  </g>

  <!-- Left Column: Zero Float Drift Demonstration -->
  <g transform="translate(36, 75)" font-family="'JetBrains Mono', monospace">
    <!-- Panel Box -->
    <rect width="420" height="165" fill="#141820" stroke="#30363d" stroke-width="0.8" rx="2" />
    
    <g transform="translate(16, 20)">
      <text font-size="10" font-weight="700" fill="#F05A28" letter-spacing="1">ARBITRARY-PRECISION FIXED DECIMAL</text>
      <text y="18" font-size="8.5" fill="#85888E">IEEE-754 Fl. Pt. Representation Failure vs. Exact Invariance</text>
      
      <!-- Contrast comparison code box -->
      <g transform="translate(0, 32)">
        <rect width="388" height="34" fill="#1f1515" stroke="#4a2020" stroke-width="0.6" rx="2" />
        <text x="10" y="14" font-size="8.5" fill="#f85149">STANDARD IEEE-754 64-BIT FLOAT DRIFT:</text>
        <text x="10" y="27" font-size="9" fill="#f85149">0.1 + 0.2 ≡ 0.3000000000000000444089209... [FAILED INVARIANT]</text>
      </g>

      <g transform="translate(0, 74)">
        <rect width="388" height="34" fill="#11221c" stroke="#1d4a36" stroke-width="0.6" rx="2" />
        <text x="10" y="14" font-size="8.5" fill="#3fb950">FINROQ FIXED DECIMAL MATH ENGINE:</text>
        <text x="10" y="27" font-size="9" fill="#3fb950">Decimal("0.10") * 3 ≡ Decimal("0.30") [ZERO ROUNDING DRIFT]</text>
      </g>

      <!-- Subtitle metadata -->
      <text y="128" font-size="8" fill="#85888E">IDEMPOTENCY: <tspan fill="#F2F0E9">UUIDv5 / Client Txn Hash</tspan> · ACID ISOLATION: <tspan fill="#F2F0E9">SERIALIZABLE</tspan></text>
    </g>
  </g>

  <!-- Right Column: Ledger Accounting Equation Invariants -->
  <g transform="translate(488, 75)" font-family="'JetBrains Mono', monospace">
    <rect width="476" height="165" fill="#141820" stroke="#30363d" stroke-width="0.8" rx="2" />
    
    <g transform="translate(20, 20)">
      <text font-size="10" font-weight="700" fill="#F2F0E9" letter-spacing="1">GAAP / IFRS DOUBLE-ENTRY LEDGER CONSERVATION</text>
      
      <!-- Balance Equation Banner -->
      <g transform="translate(0, 16)">
        <rect width="436" height="22" fill="#18202F" stroke="#2457FF" stroke-width="0.6" />
        <text x="10" y="15" font-size="9" fill="#2457FF" font-weight="700">∑ ASSETS ≡ ∑ LIABILITIES + ∑ EQUITY</text>
        <text x="426" y="15" text-anchor="end" font-size="8.5" fill="#F2F0E9">[ ε = 0.0000 ]</text>
      </g>

      <!-- Ledger Journal entries -->
      <g transform="translate(0, 48)" font-size="8.5">
        <text x="0" y="0" fill="#85888E">TX_REF</text>
        <text x="75" y="0" fill="#85888E">ACCOUNT CLUSTER</text>
        <text x="240" y="0" fill="#85888E">DEBIT</text>
        <text x="330" y="0" fill="#85888E">CREDIT</text>
        <line x1="0" y1="5" x2="436" y2="5" stroke="#2d3748" stroke-width="0.8" />

        <text x="0" y="19" fill="#F2F0E9">#4091A</text>
        <text x="75" y="19" fill="#F2F0E9">Cash Account</text>
        <text x="240" y="19" fill="#F2F0E9">14,250.0000</text>
        <text x="330" y="19" fill="#85888E">0.0000</text>

        <text x="0" y="34" fill="#F2F0E9">#4091B</text>
        <text x="75" y="34" fill="#F2F0E9">Unearned Revenue</text>
        <text x="240" y="34" fill="#85888E">0.0000</text>
        <text x="330" y="34" fill="#F2F0E9">14,250.0000</text>

        <line x1="0" y1="44" x2="436" y2="44" stroke="#2d3748" stroke-width="0.8" />
        <text x="0" y="58" fill="#2457FF" font-weight="700">NET INVARIANCE DELTA:</text>
        <text x="240" y="58" fill="#F2F0E9" font-weight="700">14,250.0000</text>
        <text x="330" y="58" fill="#F2F0E9" font-weight="700">14,250.0000</text>
      </g>

      <!-- Security / Pytest stamp -->
      <g transform="translate(0, 118)" font-size="8">
        <rect width="436" height="20" fill="#101318" stroke="#30363d" stroke-width="0.6" />
        <text x="8" y="14" fill="#85888E">VERIFIED TEST SUITE: <tspan fill="#F2F0E9" font-weight="700">177 UNIT TESTS (31 FINANCE ENGINE TESTS PASSING)</tspan></text>
      </g>
    </g>
  </g>
</svg>
