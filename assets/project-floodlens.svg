<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <linearGradient id="fl-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F151C" />
      <stop offset="100%" stop-color="#0A0E13" />
    </linearGradient>
    <pattern id="fl-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#151F2A" stroke-width="0.6" />
    </pattern>
  </defs>

  <rect width="1200" height="480" rx="8" fill="url(#fl-bg)" stroke="#1F2937" stroke-width="1.2" />
  <rect width="1200" height="480" rx="8" fill="url(#fl-grid)" opacity="0.5" />

  <rect x="0" y="0" width="1200" height="52" fill="#131B24" rx="8" />
  <path d="M 0 44 L 1200 44" stroke="#222D3D" stroke-width="1" />

  <path d="M 24 16 L 24 8 L 32 8" fill="none" stroke="#39D5E8" stroke-width="1.5" />
  <path d="M 1176 16 L 1176 8 L 1168 8" fill="none" stroke="#39D5E8" stroke-width="1.5" />

  <g transform="translate(40, 28)">
    <circle cx="0" cy="0" r="4" fill="#39D5E8" />
    <text x="14" y="4" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#39D5E8" letter-spacing="1.5">PROJECT 02 // GEOSPATIAL INTELLIGENCE</text>
    <text x="480" y="4" font-family="'JetBrains Mono', monospace" font-size="10" fill="#627182">TERRAIN HYDROLOGY &amp; DRAINAGE TOPOLOGY</text>
  </g>

  <g transform="translate(1160, 28)">
    <text x="0" y="4" font-family="'JetBrains Mono', monospace" font-size="10" fill="#FF784F" font-weight="600" text-anchor="end">EVALUATION: SCORED 27/30 IN AWS HACKATHON</text>
  </g>

  <g transform="translate(50, 90)">
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="36" font-weight="800" fill="#F1F3F5" letter-spacing="-0.5">FloodLens</text>
    <rect x="215" y="8" width="160" height="24" fill="#17202B" stroke="#2C3C4F" rx="3" />
    <text x="295" y="24" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#39D5E8" text-anchor="middle">TERRAIN HYDROLOGY</text>

    <text x="0" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" fill="#B9C2CC">
      <tspan x="0" dy="0">Urban flood risk simulation integrating Copernicus 30m DEM elevation,</tspan>
      <tspan x="0" dy="24">HAND (Height Above Nearest Drainage) terrain proxies, and GCC</tspan>
      <tspan x="0" dy="24">Chennai stormwater networks to identify bottlenecked outfalls.</tspan>
    </text>

    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="160" height="32" fill="#131A23" stroke="#222E3D" rx="4" />
      <text x="14" y="20" font-family="'JetBrains Mono', monospace" font-size="10" fill="#39D5E8" font-weight="600">COPERNICUS 30M</text>

      <rect x="170" y="0" width="155" height="32" fill="#131A23" stroke="#222E3D" rx="4" />
      <text x="184" y="20" font-family="'JetBrains Mono', monospace" font-size="10" fill="#B9C2CC" font-weight="600">HAND TOPOLOGY</text>

      <rect x="335" y="0" width="155" height="32" fill="#131A23" stroke="#222E3D" rx="4" />
      <text x="349" y="20" font-family="'JetBrains Mono', monospace" font-size="10" fill="#FF784F" font-weight="600">203 TESTS PASSING</text>
    </g>

    <g transform="translate(0, 215)">
      <rect width="490" height="125" fill="#0D1218" stroke="#1F2B3A" rx="4" />
      <text x="16" y="24" font-family="'JetBrains Mono', monospace" font-size="9" fill="#627284">// HYDRODYNAMIC RUNOFF EQUATION</text>
      <text x="16" y="48" font-family="'JetBrains Mono', monospace" font-size="11" fill="#F1F3F5">Peak Discharge Q = C &#183; I &#183; A</text>
      <text x="16" y="72" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#39D5E8">HAND = Elevation(DEM) &#8722; NearestStream(Elevation)</text>
      <text x="16" y="94" font-family="'JetBrains Mono', monospace" font-size="10" fill="#9AA4B2">GCC Chennai Wards 101-104: 20 Segments &#183; 4 Outfalls</text>
      <line x1="16" y1="106" x2="474" y2="106" stroke="#1B2633" stroke-width="1" />
      <text x="16" y="118" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#516173">AWS EVALUATION: 27/30 OFFICIAL HACKATHON SCORE</text>
    </g>
  </g>

  <!-- Right Column: Environmental Surveying System -->
  <g transform="translate(590, 85)">
    <rect width="560" height="355" fill="#10151C" stroke="#222E3D" rx="6" />

    <rect width="560" height="32" fill="#151C26" rx="6" />
    <path d="M 0 32 L 560 32" stroke="#222E3D" stroke-width="1" />
    <circle cx="18" cy="16" r="3.5" fill="#39D5E8" />
    <text x="32" y="20" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#F1F3F5">TERRAIN CONTOURS &amp; STORMWATER TOPOLOGY</text>
    <text x="542" y="20" font-family="'JetBrains Mono', monospace" font-size="9" fill="#5A697A" text-anchor="end">CHENNAI SECTOR 101-104</text>

    <!-- Contour Lines Simulation -->
    <g transform="translate(30, 45)">
      <path d="M 20 80 Q 90 20 180 50 T 320 40 T 480 70" fill="none" stroke="#1C2A3A" stroke-width="1.5" />
      <path d="M 20 120 Q 90 60 180 90 T 320 80 T 480 110" fill="none" stroke="#233448" stroke-width="1.5" />
      <path d="M 20 160 Q 90 100 180 130 T 320 120 T 480 150" fill="none" stroke="#2D415A" stroke-width="1.5" stroke-dasharray="3,3" />
      <path d="M 20 200 Q 90 140 180 170 T 320 160 T 480 190" fill="none" stroke="#385272" stroke-width="1.5" />

      <!-- Drainage Vectors -->
      <path d="M 80 50 L 150 110 L 260 130 L 390 180" fill="none" stroke="#39D5E8" stroke-width="2" />
      <circle cx="80" cy="50" r="4" fill="#131B24" stroke="#39D5E8" stroke-width="1.5" />
      <circle cx="150" cy="110" r="4" fill="#131B24" stroke="#39D5E8" stroke-width="1.5" />
      <circle cx="260" cy="130" r="4" fill="#131B24" stroke="#39D5E8" stroke-width="1.5" />
      <circle cx="390" cy="180" r="6" fill="#FF784F" stroke="#FFFFFF" stroke-width="1.5" />

      <text x="95" y="48" font-family="'JetBrains Mono', monospace" font-size="8" fill="#39D5E8">INLET 12A</text>
      <text x="165" y="108" font-family="'JetBrains Mono', monospace" font-size="8" fill="#39D5E8">CULVERT B</text>
      <text x="275" y="128" font-family="'JetBrains Mono', monospace" font-size="8" fill="#39D5E8">CH-102</text>
      <text x="405" y="183" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#FF784F">OUTFLOW 04 (OVERFLOW RISK)</text>
    </g>

    <!-- Geospatial Telemetry HUD -->
    <g transform="translate(25, 235)">
      <rect width="510" height="95" fill="#0D1217" stroke="#1F2B38" rx="4" />

      <g transform="translate(20, 20)">
        <text x="0" y="12" font-family="'JetBrains Mono', monospace" font-size="9" fill="#8E9DAE">RAINFALL INTENSITY</text>
        <text x="0" y="32" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#F1F3F5">82.4 mm/hr</text>
        <text x="0" y="48" font-family="'JetBrains Mono', monospace" font-size="8" fill="#FF784F">50-YR MONSOON EVENT</text>
      </g>

      <g transform="translate(180, 20)">
        <text x="0" y="12" font-family="'JetBrains Mono', monospace" font-size="9" fill="#8E9DAE">NETWORK BOTTLENECK</text>
        <text x="0" y="32" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#39D5E8">Segment 14-B</text>
        <text x="0" y="48" font-family="'JetBrains Mono', monospace" font-size="8" fill="#39D5E8">118% DESIGN CAPACITY</text>
      </g>

      <g transform="translate(350, 20)">
        <text x="0" y="12" font-family="'JetBrains Mono', monospace" font-size="9" fill="#8E9DAE">HAND RISK INDEX</text>
        <text x="0" y="32" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#FF784F">HIGH (&lt; 0.8m)</text>
        <text x="0" y="48" font-family="'JetBrains Mono', monospace" font-size="8" fill="#8E9DAE">WARD 103 RESIDENTIAL</text>
      </g>
    </g>
  </g>
</svg>