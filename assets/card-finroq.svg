<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="fin-card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141923" />
      <stop offset="100%" stop-color="#0E121A" />
    </linearGradient>
  </defs>

  <rect width="600" height="340" rx="8" fill="url(#fin-card-bg)" stroke="#1F2937" stroke-width="1.2" />

  <!-- Top Header Pill -->
  <g transform="translate(24, 28)">
    <rect width="180" height="22" fill="#10151E" stroke="#222E3E" rx="3" />
    <circle cx="10" cy="11" r="3" fill="#4C8DFF" />
    <text x="18" y="15" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#4C8DFF">FINANCIAL INTELLIGENCE</text>
  </g>

  <!-- Project Title -->
  <text x="24" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" font-weight="900" fill="#F4F4F5">FINROQ</text>
  <text x="24" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#A1A1AA">
    Personal finance and financial intelligence platform.
  </text>

  <!-- Financial Visualization Console -->
  <g transform="translate(24, 142)">
    <rect width="552" height="150" fill="#0B0D12" stroke="#1D2533" rx="5" />
    <rect width="552" height="24" fill="#10151F" rx="5" />
    <circle cx="12" cy="12" r="3" fill="#4C8DFF" />
    <text x="22" y="16" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#71717A">DOUBLE-ENTRY LEDGER ENGINE</text>
    <text x="540" y="16" font-family="'JetBrains Mono', monospace" font-size="8" fill="#E65353" text-anchor="end">ZERO FLOAT DRIFT</text>

    <g transform="translate(20, 45)">
      <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="9" fill="#58697D">// ACCOUNTING INVARIANT</text>
      <text x="0" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#F4F4F5">&#8721; Assets == &#8721; Liabilities + &#8721; Equity</text>
      
      <text x="0" y="52" font-family="'JetBrains Mono', monospace" font-size="10" fill="#4C8DFF">Decimal('0.10') * 3 == Decimal('0.30')</text>
      <text x="0" y="72" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#71717A">IEEE 754 Float: 0.30000000000000004 &#8594; <tspan fill="#E65353">REJECTED</tspan></text>
      
      <line x1="0" y1="88" x2="512" y2="88" stroke="#182230" stroke-width="1" />
      <text x="0" y="106" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#4C8DFF">177 UNIT TESTS &amp;bull; 31 ENGINE TESTS &amp;bull; ARBITRARY PRECISION</text>
    </g>
  </g>
</svg>