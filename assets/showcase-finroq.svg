<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <linearGradient id="finroqBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090f14" />
      <stop offset="100%" stop-color="#0d151c" />
    </linearGradient>
    <linearGradient id="emeraldBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636" />
      <stop offset="100%" stop-color="#3fb950" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "SF Mono", Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .p-title { font-size: 26px; font-weight: 800; fill: #f0f6fc; letter-spacing: -0.01em; }
    .p-badge { font-size: 10px; font-weight: 700; fill: #3fb950; letter-spacing: 0.15em; text-transform: uppercase; }
    .p-desc { font-size: 13.5px; fill: #c9d1d9; line-height: 1.5; }
    .tech-pill { font-size: 11px; fill: #7ee787; font-weight: 500; }
  </style>

  <!-- Container -->
  <rect width="900" height="240" rx="6" fill="url(#finroqBg)" stroke="#30363d" stroke-width="1" />
  
  <!-- Left Accent Accent Line -->
  <rect x="0" y="0" width="4" height="240" rx="2" fill="url(#emeraldBar)" />

  <!-- Left Content -->
  <g transform="translate(36, 32)">
    <g class="mono">
      <rect x="0" y="0" width="180" height="20" rx="3" fill="#238636" fill-opacity="0.15" stroke="#2ea043" stroke-width="0.7" />
      <text x="10" y="14" class="p-badge">CORE ACCOUNTING BACKEND</text>
    </g>

    <text x="0" y="52" class="sans p-title">FINROQ</text>
    <text x="0" y="76" class="sans p-desc" width="480">An AI-first personal finance platform engineered to make complex fiscal decisions transparent.</text>
    <text x="0" y="96" class="sans p-desc" fill="#8b949e">Eliminates IEEE-754 floating-point drift across 17 unified double-entry ledger modules, backed</text>
    <text x="0" y="114" class="sans p-desc" fill="#8b949e">by DeepSeek-R1 analytical agent reasoning and immutable cryptographic audit journals.</text>

    <!-- Tech Stack Row -->
    <g transform="translate(0, 142)" class="mono">
      <text x="0" y="12" font-size="10" fill="#8b949e" letter-spacing="0.1em">ENGINEERED WITH:</text>
      <rect x="110" y="0" width="76" height="20" rx="3" fill="#161b22" stroke="#30363d" stroke-width="0.7" />
      <text x="120" y="14" class="tech-pill">Next.js 14</text>

      <rect x="194" y="0" width="66" height="20" rx="3" fill="#161b22" stroke="#30363d" stroke-width="0.7" />
      <text x="204" y="14" class="tech-pill">FastAPI</text>

      <rect x="268" y="0" width="102" height="20" rx="3" fill="#161b22" stroke="#30363d" stroke-width="0.7" />
      <text x="278" y="14" class="tech-pill">PostgreSQL 16</text>

      <rect x="378" y="0" width="94" height="20" rx="3" fill="#161b22" stroke="#30363d" stroke-width="0.7" />
      <text x="388" y="14" class="tech-pill">SQLAlchemy</text>

      <rect x="480" y="0" width="72" height="20" rx="3" fill="#161b22" stroke="#30363d" stroke-width="0.7" />
      <text x="490" y="14" class="tech-pill">Alembic</text>
    </g>
  </g>

  <!-- Right Architecture Card -->
  <g transform="translate(590, 24)">
    <rect x="0" y="0" width="280" height="192" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1" />
    <rect x="0" y="0" width="280" height="24" rx="4" fill="#161b22" />
    <text x="12" y="16" class="mono" font-size="10" fill="#8b949e">INVARIANT RECONCILIATION</text>
    
    <g class="mono" transform="translate(14, 38)" font-size="11">
      <text x="0" y="14" fill="#7ee787">✓ Python Decimal Engine</text>
      <text x="0" y="32" fill="#8b949e" font-size="9.5">Arbitrary precision · Zero float drift</text>

      <line x1="0" y1="44" x2="252" y2="44" stroke="#21262d" stroke-width="1" />

      <text x="0" y="60" fill="#7ee787">✓ 247 / 247 Pytest Suites</text>
      <text x="0" y="78" fill="#8b949e" font-size="9.5">100% Core accounting logic verified</text>

      <line x1="0" y1="90" x2="252" y2="90" stroke="#21262d" stroke-width="1" />

      <text x="0" y="106" fill="#7ee787">✓ Argon2id + JWT Security</text>
      <text x="0" y="124" fill="#8b949e" font-size="9.5">Immutable audit journal isolation</text>
    </g>
  </g>
</svg>

