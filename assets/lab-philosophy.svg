<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="phil-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11161F" />
      <stop offset="100%" stop-color="#0A0D12" />
    </linearGradient>
    <pattern id="phil-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#151C25" stroke-width="0.6" />
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="8" fill="url(#phil-bg)" stroke="#1F2937" stroke-width="1.2" />
  <rect width="1200" height="320" rx="8" fill="url(#phil-grid)" opacity="0.6" />

  <path d="M 24 16 L 24 8 L 32 8" fill="none" stroke="#39D5E8" stroke-width="1.5" />
  <path d="M 1176 16 L 1176 8 L 1168 8" fill="none" stroke="#39D5E8" stroke-width="1.5" />
  <path d="M 24 304 L 24 312 L 32 312" fill="none" stroke="#39D5E8" stroke-width="1.5" />
  <path d="M 1176 304 L 1176 312 L 1168 312" fill="none" stroke="#39D5E8" stroke-width="1.5" />

  <g transform="translate(50, 42)">
    <circle cx="0" cy="0" r="4" fill="#39D5E8" />
    <text x="16" y="4" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#39D5E8" letter-spacing="1.5">LABORATORY PROTOCOL // CORE PRINCIPLES</text>
    <text x="0" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="800" fill="#F1F3F5">"Deterministic code decides. The generative model only proposes."</text>
  </g>

  <!-- 4 Step Protocol Cards -->
  <g transform="translate(50, 115)">
    <!-- Phase 01 -->
    <g transform="translate(0, 0)">
      <rect width="260" height="160" fill="#121822" stroke="#1F2B3B" rx="5" />
      <rect width="260" height="6" fill="#39D5E8" rx="3" />
      <text x="18" y="32" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#39D5E8">PHASE 01</text>
      <text x="18" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#F1F3F5">BUILD</text>
      <text x="18" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#9AA4B2">
        <tspan x="18" dy="0">Architect foundational data structures</tspan>
        <tspan x="18" dy="18">and core domain models before</tspan>
        <tspan x="18" dy="18">writing a single line of interface.</tspan>
      </text>
      <text x="18" y="145" font-family="'JetBrains Mono', monospace" font-size="9" fill="#627284">DOMAIN DOMINANCE</text>
    </g>

    <!-- Phase 02 -->
    <g transform="translate(280, 0)">
      <rect width="260" height="160" fill="#121822" stroke="#1F2B3B" rx="5" />
      <rect width="260" height="6" fill="#39D5E8" rx="3" />
      <text x="18" y="32" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#39D5E8">PHASE 02</text>
      <text x="18" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#F1F3F5">VERIFY</text>
      <text x="18" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#9AA4B2">
        <tspan x="18" dy="0">Never trust unverified outputs.</tspan>
        <tspan x="18" dy="18">Enforce mathematical invariants and</tspan>
        <tspan x="18" dy="18">deterministic verification gates.</tspan>
      </text>
      <text x="18" y="145" font-family="'JetBrains Mono', monospace" font-size="9" fill="#627284">ZERO FLOAT DRIFT</text>
    </g>

    <!-- Phase 03 -->
    <g transform="translate(560, 0)">
      <rect width="260" height="160" fill="#121822" stroke="#1F2B3B" rx="5" />
      <rect width="260" height="6" fill="#FF784F" rx="3" />
      <text x="18" y="32" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#FF784F">PHASE 03</text>
      <text x="18" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#F1F3F5">MEASURE</text>
      <text x="18" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#9AA4B2">
        <tspan x="18" dy="0">Validate against real topography,</tspan>
        <tspan x="18" dy="18">real transaction traces, and</tspan>
        <tspan x="18" dy="18">verifiable external benchmarks.</tspan>
      </text>
      <text x="18" y="145" font-family="'JetBrains Mono', monospace" font-size="9" fill="#627284">EMPIRICAL GROUND TRUTH</text>
    </g>

    <!-- Phase 04 -->
    <g transform="translate(840, 0)">
      <rect width="260" height="160" fill="#121822" stroke="#1F2B3B" rx="5" />
      <rect width="260" height="6" fill="#39D5E8" rx="3" />
      <text x="18" y="32" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#39D5E8">PHASE 04</text>
      <text x="18" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#F1F3F5">IMPROVE</text>
      <text x="18" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#9AA4B2">
        <tspan x="18" dy="0">Iterate ruthlessly. Eliminate</tspan>
        <tspan x="18" dy="18">cognitive friction while tightening</tspan>
        <tspan x="18" dy="18">system-level performance.</tspan>
      </text>
      <text x="18" y="145" font-family="'JetBrains Mono', monospace" font-size="9" fill="#627284">CONTINUOUS REFACTORING</text>
    </g>
  </g>
</svg>