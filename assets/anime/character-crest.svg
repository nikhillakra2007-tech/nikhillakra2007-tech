<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="320">
  <defs>
    <linearGradient id="crestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ff0055" />
    </linearGradient>

    <filter id="shadowGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes spinSlow {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulseEye {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.12); opacity: 1; }
    }
    .rotating-ring {
      transform-origin: 160px 160px;
      animation: spinSlow 20s linear infinite;
    }
    .pulse-glow {
      transform-origin: 160px 160px;
      animation: pulseEye 3s ease-in-out infinite;
    }
    .mono-crest {
      font-family: 'JetBrains Mono', monospace;
      font-size: 8px;
      letter-spacing: 2px;
      fill: #c084fc;
    }
  </style>

  <!-- Outer Dark Circle -->
  <circle cx="160" cy="160" r="150" fill="#090714" stroke="#a855f7" stroke-width="2" />
  <circle cx="160" cy="160" r="142" fill="none" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" stroke-dasharray="8 6" />

  <!-- Rotating Outer Glyphs Ring -->
  <g class="rotating-ring">
    <circle cx="160" cy="160" r="130" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="16 12 4 12" />
    <circle cx="160" cy="30" r="4" fill="#38bdf8" />
    <circle cx="290" cy="160" r="4" fill="#ff0055" />
    <circle cx="160" cy="290" r="4" fill="#38bdf8" />
    <circle cx="30" cy="160" r="4" fill="#a855f7" />
  </g>

  <!-- Hexagon Core -->
  <polygon points="160,50 255,105 255,215 160,270 65,215 65,105" fill="#0f0c22" stroke="url(#crestGrad)" stroke-width="2.5" />

  <!-- Shadow Monarch Crown / Horn Silhouette -->
  <path d="M 95 190 Q 120 130 160 85 Q 200 130 225 190 Q 185 165 160 175 Q 135 165 95 190 Z" fill="#a855f7" opacity="0.85" filter="url(#shadowGlow)" />
  <path d="M 115 195 Q 140 140 160 110 Q 180 140 205 195 Q 180 180 160 185 Q 140 180 115 195 Z" fill="#38bdf8" opacity="0.9" />

  <!-- Glowing Monarch Pupil / Neon Core -->
  <g class="pulse-glow" filter="url(#shadowGlow)">
    <circle cx="160" cy="160" r="24" fill="#080512" stroke="#ff0055" stroke-width="2" />
    <circle cx="160" cy="160" r="14" fill="#ff0055" />
    <circle cx="160" cy="160" r="6" fill="#ffffff" />
    <!-- Reticle crosshair -->
    <line x1="160" y1="126" x2="160" y2="194" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="126" y1="160" x2="194" y2="160" stroke="#38bdf8" stroke-width="1.5" />
  </g>

  <!-- Japanese Kanji Core -->
  <text x="160" y="240" font-family="'Noto Sans JP', sans-serif" font-size="14" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="4">
    影の君主
  </text>
  <text x="160" y="255" class="mono-crest" text-anchor="middle">
    SHADOW CORE // VERIFIED
  </text>
</svg>

