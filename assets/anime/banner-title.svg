<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 120" width="100%" height="100%">
  <defs>
    <linearGradient id="blade-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3366" />
      <stop offset="50%" stop-color="#FFCC00" />
      <stop offset="100%" stop-color="#FF3366" />
    </linearGradient>
    <linearGradient id="blade-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0507" />
      <stop offset="100%" stop-color="#140b0f" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="120" fill="url(#blade-dark)" rx="4" />
  <rect x="2" y="2" width="996" height="116" fill="none" stroke="#33141f" stroke-width="1" rx="4" />

  <!-- Crimson Slash Glow -->
  <line x1="40" y1="95" x2="960" y2="25" stroke="#FF2A55" stroke-width="1.5" stroke-opacity="0.6" />
  <line x1="40" y1="95" x2="960" y2="25" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.8" />

  <!-- Japanese Kanji Watermark -->
  <text x="500" y="78" font-family="'Noto Sans JP', 'Segoe UI', sans-serif" font-size="64" font-weight="900" fill="#FF2A55" fill-opacity="0.06" text-anchor="middle" letter-spacing="20">刀剣技術</text>

  <!-- Main Title & Identity -->
  <text x="500" y="52" font-family="'Cinzel', 'Trajan Pro', 'Noto Serif JP', serif, monospace" font-size="28" font-weight="900" fill="#FFF5EA" text-anchor="middle" letter-spacing="8">NIKHIL LAKRA</text>
  <text x="500" y="76" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" fill="url(#blade-gold)" text-anchor="middle" letter-spacing="4">THE WAY OF THE BLADE // SYSTEMS &amp; HIGH-PRECISION ENGINEERING</text>

  <!-- Subtitle Coordinates -->
  <text x="500" y="100" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" fill="#88707A" text-anchor="middle" letter-spacing="2">JAIPUR [26.9124° N, 75.7873° E] · MANIPAL UNIVERSITY JAIPUR CSE '29 · DETERMINISTIC RIGOR</text>

  <!-- Corner red accent seals -->
  <polygon points="12,12 28,12 12,28" fill="#FF2A55" />
  <polygon points="988,12 972,12 988,28" fill="#FF2A55" />
  <polygon points="12,108 28,108 12,92" fill="#FF2A55" />
  <polygon points="988,108 972,108 988,92" fill="#FF2A55" />
</svg>
