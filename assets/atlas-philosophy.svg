<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="100%" height="100%">
  <defs>
    <pattern id="phil-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#22262E" stroke-width="0.7" opacity="0.4" />
    </pattern>
    <linearGradient id="phil-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2457FF" />
      <stop offset="50%" stop-color="#85888E" />
      <stop offset="100%" stop-color="#F05A28" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="200" fill="#101216" />
  <rect width="1000" height="200" fill="url(#phil-grid)" />
  <rect x="20" y="16" width="960" height="168" fill="none" stroke="#262B35" stroke-width="1" />

  <!-- Corner registration ticks -->
  <path d="M 12 24 L 28 24 M 20 16 L 20 32" stroke="#85888E" stroke-width="1.2" />
  <path d="M 972 24 L 988 24 M 980 16 L 980 32" stroke="#85888E" stroke-width="1.2" />
  <path d="M 12 176 L 28 176 M 20 168 L 20 184" stroke="#85888E" stroke-width="1.2" />
  <path d="M 972 176 L 988 176 M 980 168 L 980 184" stroke="#85888E" stroke-width="1.2" />

  <!-- Section Label -->
  <text x="45" y="38" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#85888E" letter-spacing="1.5">CORE DISCIPLINE // ITERATION LOOP</text>
  <text x="680" y="38" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#5F6470" letter-spacing="1">DETERMINISTIC VERIFICATION PROTOCOL</text>

  <!-- Horizontal continuous axis line -->
  <line x1="45" y1="104" x2="955" y2="104" stroke="#2C323E" stroke-width="1.5" />
  <line x1="140" y1="104" x2="860" y2="104" stroke="url(#phil-grad)" stroke-width="1.5" stroke-dasharray="4,3" />

  <!-- NODE 1: BUILD -->
  <g transform="translate(130, 104)">
    <circle cx="0" cy="0" r="28" fill="#14171E" stroke="#2457FF" stroke-width="2" />
    <circle cx="0" cy="0" r="18" fill="#1C222D" />
    <text x="0" y="4" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="800" fill="#2457FF" text-anchor="middle">01</text>
    <text x="0" y="-38" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#F2F0E9" text-anchor="middle" letter-spacing="1">BUILD</text>
    <text x="0" y="46" font-family="'JetBrains Mono', monospace" font-size="8" fill="#85888E" text-anchor="middle">Typed Architecture</text>
    <text x="0" y="58" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#5F6470" text-anchor="middle">Formal Invariants</text>
  </g>

  <!-- Flow arrow 1 -> 2 -->
  <polygon points="300,100 312,104 300,108" fill="#2457FF" />

  <!-- NODE 2: VERIFY -->
  <g transform="translate(376, 104)">
    <circle cx="0" cy="0" r="28" fill="#14171E" stroke="#85888E" stroke-width="2" />
    <circle cx="0" cy="0" r="18" fill="#1C222D" />
    <text x="0" y="4" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="800" fill="#F2F0E9" text-anchor="middle">02</text>
    <text x="0" y="-38" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#F2F0E9" text-anchor="middle" letter-spacing="1">VERIFY</text>
    <text x="0" y="46" font-family="'JetBrains Mono', monospace" font-size="8" fill="#85888E" text-anchor="middle">AST &amp; MicroVM DAST</text>
    <text x="0" y="58" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#5F6470" text-anchor="middle">Zero Assumptions</text>
  </g>

  <!-- Flow arrow 2 -> 3 -->
  <polygon points="546,100 558,104 546,108" fill="#85888E" />

  <!-- NODE 3: MEASURE -->
  <g transform="translate(623, 104)">
    <circle cx="0" cy="0" r="28" fill="#14171E" stroke="#85888E" stroke-width="2" />
    <circle cx="0" cy="0" r="18" fill="#1C222D" />
    <text x="0" y="4" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="800" fill="#F2F0E9" text-anchor="middle">03</text>
    <text x="0" y="-38" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#F2F0E9" text-anchor="middle" letter-spacing="1">MEASURE</text>
    <text x="0" y="46" font-family="'JetBrains Mono', monospace" font-size="8" fill="#85888E" text-anchor="middle">Sub-ms Latency</text>
    <text x="0" y="58" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#5F6470" text-anchor="middle">Exact Decimal Parity</text>
  </g>

  <!-- Flow arrow 3 -> 4 -->
  <polygon points="793,100 805,104 793,108" fill="#F05A28" />

  <!-- NODE 4: IMPROVE -->
  <g transform="translate(870, 104)">
    <circle cx="0" cy="0" r="28" fill="#14171E" stroke="#F05A28" stroke-width="2" />
    <circle cx="0" cy="0" r="18" fill="#251713" />
    <text x="0" y="4" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="800" fill="#F05A28" text-anchor="middle">04</text>
    <text x="0" y="-38" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#F05A28" text-anchor="middle" letter-spacing="1">IMPROVE</text>
    <text x="0" y="46" font-family="'JetBrains Mono', monospace" font-size="8" fill="#85888E" text-anchor="middle">Hardened Logic</text>
    <text x="0" y="58" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#5F6470" text-anchor="middle">Continuous Loop</text>
  </g>
</svg>

