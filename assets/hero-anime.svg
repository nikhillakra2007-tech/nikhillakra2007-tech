<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E1219" />
      <stop offset="70%" stop-color="#0B0D12" />
      <stop offset="100%" stop-color="#090B0F" />
    </linearGradient>

    <linearGradient id="sky-crimson" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0B0D12" />
      <stop offset="40%" stop-color="#3D0B14" />
      <stop offset="75%" stop-color="#8B1827" />
      <stop offset="100%" stop-color="#E65353" />
    </linearGradient>

    <linearGradient id="moon-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF3B5C" />
      <stop offset="60%" stop-color="#E65353" />
      <stop offset="100%" stop-color="#8B1827" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="blue-rim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4C8DFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#4C8DFF" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="jacket-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B2230" />
      <stop offset="50%" stop-color="#10151E" />
      <stop offset="100%" stop-color="#080B0F" />
    </linearGradient>

    <filter id="crimson-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="eye-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Speed Action Lines -->
    <pattern id="manga-speed" width="30" height="30" patternUnits="userSpaceOnUse">
      <line x1="0" y1="30" x2="30" y2="0" stroke="#161C26" stroke-width="0.7" opacity="0.4" />
    </pattern>
  </defs>

  <!-- Outer Card Frame -->
  <rect width="1000" height="620" rx="12" fill="url(#card-bg)" stroke="#1F2937" stroke-width="1.2" />

  <!-- ================= TOP SECTION: CINEMATIC ARTWORK (Height: 440) ================= -->
  <g clip-path="url(#artwork-clip)">
    <clipPath id="artwork-clip">
      <rect x="0" y="0" width="1000" height="440" rx="12" />
    </clipPath>

    <!-- Deep Crimson Night Sky Background -->
    <rect x="0" y="0" width="1000" height="440" fill="url(#sky-crimson)" opacity="0.85" />
    <rect x="0" y="0" width="1000" height="440" fill="url(#manga-speed)" />

    <!-- Distant City Skyline Silhouettes (Left & Right Alley Walls) -->
    <!-- Left Buildings -->
    <polygon points="0,80 70,120 70,440 0,440" fill="#0A0D13" />
    <polygon points="50,140 140,180 140,440 50,440" fill="#07090E" />
    <polygon points="120,200 220,250 220,440 120,440" fill="#05070A" />

    <!-- Left Building Window Slits -->
    <line x1="25" y1="180" x2="25" y2="240" stroke="#4C8DFF" stroke-width="1.5" opacity="0.6" />
    <line x1="35" y1="210" x2="35" y2="280" stroke="#4C8DFF" stroke-width="1.5" opacity="0.4" />
    <line x1="90" y1="240" x2="90" y2="320" stroke="#4C8DFF" stroke-width="1.5" opacity="0.5" />
    <line x1="160" y1="290" x2="160" y2="360" stroke="#E65353" stroke-width="1.5" opacity="0.5" />

    <!-- Right Buildings -->
    <polygon points="1000,80 930,120 930,440 1000,440" fill="#0A0D13" />
    <polygon points="950,140 860,180 860,440 950,440" fill="#07090E" />
    <polygon points="880,200 780,250 780,440 880,440" fill="#05070A" />

    <!-- Right Building Window Slits -->
    <line x1="975" y1="180" x2="975" y2="240" stroke="#4C8DFF" stroke-width="1.5" opacity="0.6" />
    <line x1="965" y1="210" x2="965" y2="280" stroke="#4C8DFF" stroke-width="1.5" opacity="0.4" />
    <line x1="910" y1="240" x2="910" y2="320" stroke="#4C8DFF" stroke-width="1.5" opacity="0.5" />
    <line x1="840" y1="290" x2="840" y2="360" stroke="#E65353" stroke-width="1.5" opacity="0.5" />

    <!-- Atmospheric Crimson Moon / Core Halo (Behind Character) -->
    <circle cx="500" cy="220" r="160" fill="url(#moon-glow)" filter="url(#crimson-blur)" opacity="0.75" />
    <circle cx="500" cy="220" r="105" fill="#E65353" opacity="0.9" />

    <!-- Manga Focus Radiance Vectors (Drawn inward toward character) -->
    <g opacity="0.3">
      <line x1="150" y1="60" x2="420" y2="180" stroke="#F4F4F5" stroke-width="0.8" />
      <line x1="200" y1="30" x2="440" y2="170" stroke="#F4F4F5" stroke-width="0.8" />
      <line x1="850" y1="60" x2="580" y2="180" stroke="#F4F4F5" stroke-width="0.8" />
      <line x1="800" y1="30" x2="560" y2="170" stroke="#F4F4F5" stroke-width="0.8" />
      <line x1="280" y1="420" x2="440" y2="300" stroke="#4C8DFF" stroke-width="1" />
      <line x1="720" y1="420" x2="560" y2="300" stroke="#4C8DFF" stroke-width="1" />
    </g>

    <!-- Floating Energy Sparks & Bokeh -->
    <circle cx="410" cy="140" r="2" fill="#FFFFFF" opacity="0.8" />
    <circle cx="430" cy="110" r="1.5" fill="#4C8DFF" />
    <circle cx="580" cy="130" r="2.5" fill="#FFFFFF" opacity="0.9" />
    <circle cx="610" cy="160" r="1.5" fill="#E65353" />
    <circle cx="370" cy="230" r="2" fill="#4C8DFF" opacity="0.8" />
    <circle cx="630" cy="240" r="2" fill="#4C8DFF" opacity="0.8" />
    <polygon points="460,85 464,89 460,93 456,89" fill="#E65353" opacity="0.85" />
    <polygon points="540,80 544,84 540,88 536,84" fill="#4C8DFF" opacity="0.85" />

    <!-- ================= ANIME PROTAGONIST HERO CHARACTER ================= -->
    <g transform="translate(500, 260)">
      <!-- Torso / High-Collar Urban Streetwear Jacket -->
      <!-- Back Shadow Base -->
      <path d="M -160 190 L -130 110 L -65 50 L 65 50 L 130 110 L 160 190 Z" fill="#06080B" />
      
      <!-- Jacket Body -->
      <path d="M -150 190 L -120 115 L -60 55 L 60 55 L 120 115 L 150 190 Z" fill="url(#jacket-grad)" stroke="#263242" stroke-width="1.2" />

      <!-- Left & Right Shoulder Epaulets with Blue Rim Light -->
      <path d="M -150 190 L -120 115 L -80 120 L -110 190 Z" fill="#141B26" stroke="#4C8DFF" stroke-width="1.2" />
      <path d="M 150 190 L 120 115 L 80 120 L 110 190 Z" fill="#141B26" stroke="#4C8DFF" stroke-width="1.2" />

      <!-- High-Collar Flaps -->
      <polygon points="-65,58 -45,-5 -22,48" fill="#121822" stroke="#2D3A4E" stroke-width="1.2" />
      <polygon points="65,58 45,-5 22,48" fill="#151C28" stroke="#2D3A4E" stroke-width="1.2" />

      <!-- Glowing Cyan Collar Seamlines -->
      <line x1="-58" y1="52" x2="-40" y2="8" stroke="#4C8DFF" stroke-width="1.5" />
      <line x1="58" y1="52" x2="40" y2="8" stroke="#4C8DFF" stroke-width="1.5" />

      <!-- Inner High-Contrast Shirt -->
      <polygon points="-25,48 0,82 25,48 0,38" fill="#0A0D12" stroke="#1F2836" stroke-width="1" />
      <line x1="0" y1="42" x2="0" y2="80" stroke="#E65353" stroke-width="1.5" />

      <!-- Neck & Cel Shadow -->
      <polygon points="-20,38 -18,-15 18,-15 20,38" fill="#E8C7BC" />
      <polygon points="-18,5 0,28 18,5 20,38 -20,38" fill="#B3897C" />

      <!-- Head & Angular Chin Silhouette -->
      <polygon points="-42,-28 -46,-52 -28,-95 28,-95 46,-52 42,-28 0,14" fill="#F4D3C7" stroke="#9A7064" stroke-width="0.8" />
      <!-- Jaw Shadow -->
      <polygon points="-42,-28 -25,-10 0,14 -15,5 -42,-18" fill="#B3897C" opacity="0.6" />
      <polygon points="42,-28 25,-10 0,14 15,5 42,-18" fill="#C99E91" opacity="0.5" />

      <!-- Ears -->
      <polygon points="-46,-50 -54,-40 -44,-24 -42,-30" fill="#DDB5A7" stroke="#9A7064" stroke-width="0.8" />
      <polygon points="46,-50 54,-40 44,-24 42,-30" fill="#DDB5A7" stroke="#9A7064" stroke-width="0.8" />

      <!-- Confident Minimalist Mouth -->
      <path d="M -12 -5 Q 0 -2 12 -6" fill="none" stroke="#5E4038" stroke-width="2.2" stroke-linecap="round" />
      <line x1="-4" y1="1" x2="6" y2="0" stroke="#986F63" stroke-width="1.2" />

      <!-- Sharp Anime Nose -->
      <path d="M 0 -24 L 2.5 -15 L -2.5 -15" fill="#7D554B" />

      <!-- Determined Focused Anime Eyes (Electric Blue Glow) -->
      <!-- Left Eye -->
      <g transform="translate(-20, -32)">
        <path d="M -18 -4 L 8 -10 L 10 -7" fill="none" stroke="#121722" stroke-width="2.8" stroke-linecap="round" />
        <path d="M -15 -1 L 7 -5" fill="none" stroke="#10151F" stroke-width="2.2" />
        <polygon points="-13,-1 6,-5 4,4 -11,5" fill="#FFFFFF" />
        <!-- Blue Iris -->
        <circle cx="-3" cy="0" r="4.8" fill="#4C8DFF" filter="url(#eye-glow)" />
        <circle cx="-3" cy="0" r="2.4" fill="#0A1826" />
        <circle cx="-4.5" cy="-1.5" r="1.3" fill="#FFFFFF" />
        <path d="M -11 6 L 4 5" fill="none" stroke="#10151F" stroke-width="1.2" />
      </g>

      <!-- Right Eye -->
      <g transform="translate(20, -32)">
        <path d="M -10 -7 L -8 -10 L 18 -4" fill="none" stroke="#121722" stroke-width="2.8" stroke-linecap="round" />
        <path d="M -7 -5 L 15 -1" fill="none" stroke="#10151F" stroke-width="2.2" />
        <polygon points="-6,-5 13,-1 11,5 -4,4" fill="#FFFFFF" />
        <!-- Blue Iris -->
        <circle cx="3" cy="0" r="4.8" fill="#4C8DFF" filter="url(#eye-glow)" />
        <circle cx="3" cy="0" r="2.4" fill="#0A1826" />
        <circle cx="1.5" cy="-1.5" r="1.3" fill="#FFFFFF" />
        <path d="M -4 5 L 11 6" fill="none" stroke="#10151F" stroke-width="1.2" />
      </g>

      <!-- Layered Windswept Dark Anime Hair -->
      <!-- Back Hair Mask -->
      <path d="M -60 -45 L -72 -78 L -50 -105 L 0 -128 L 50 -105 L 72 -78 L 60 -45 Z" fill="#090C10" />

      <!-- Main Crown & Angular Swept Spikes -->
      <path d="M -52 -68 L -75 -95 L -42 -90 L -55 -122 L -18 -105 L 0 -134 L 20 -108 L 55 -124 L 42 -92 L 75 -98 L 52 -68 Z" fill="#151C26" stroke="#253244" stroke-width="1.2" />

      <!-- Forehead Bangs -->
      <polygon points="-36,-72 -24,-38 -16,-65" fill="#10151E" />
      <polygon points="-20,-68 -8,-34 -2,-62" fill="#182230" />
      <polygon points="-4,-65 8,-30 14,-62" fill="#121822" />
      <polygon points="12,-68 26,-38 32,-70" fill="#16202D" />

      <!-- Electric Blue Rim Highlights along Hair Tips -->
      <path d="M -75 -95 L -55 -122 L 0 -134 L 55 -124 L 75 -98" fill="none" stroke="url(#blue-rim)" stroke-width="2.5" />
    </g>

    <!-- Japanese Watermark Stamp: 限界突破 (Breaking Limits) -->
    <g transform="translate(40, 40)">
      <rect width="105" height="26" fill="#121824" stroke="#4C8DFF" stroke-width="1.2" rx="4" />
      <circle cx="12" cy="13" r="3.5" fill="#E65353" />
      <text x="24" y="17" font-family="'Noto Sans JP', sans-serif" font-size="11" font-weight="700" fill="#F4F4F5" letter-spacing="1.5">&#38480;&#30028;&#31361;&#30772;</text>
    </g>

    <g transform="translate(850, 40)">
      <rect width="110" height="26" fill="#121824" stroke="#1F2937" rx="4" />
      <text x="55" y="17" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#4C8DFF" text-anchor="middle" letter-spacing="1">ARC // 001</text>
    </g>
  </g>

  <!-- ================= BOTTOM SECTION: EDITORIAL IDENTITY PLATE (Height: 180) ================= -->
  <!-- Separator Hairline -->
  <line x1="0" y1="440" x2="1000" y2="440" stroke="#1F2937" stroke-width="1.2" />

  <g transform="translate(50, 465)">
    <!-- Main Headline Typography: NIKHIL LAKRA -->
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="38" font-weight="900" fill="#F4F4F5" letter-spacing="-0.5">NIKHIL LAKRA</text>

    <!-- Tagline (The Persona) -->
    <text x="0" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#A1A1AA">
      Building things. <tspan fill="#4C8DFF">Breaking limits.</tspan> <tspan fill="#E65353">Getting better.</tspan>
    </text>

    <!-- Identity & Academic Footprint -->
    <g transform="translate(0, 92)">
      <rect width="320" height="26" fill="#141923" stroke="#222C3A" rx="3" />
      <circle cx="12" cy="13" r="3" fill="#4C8DFF" />
      <text x="24" y="17" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5" font-weight="700" fill="#F4F4F5">
        CSE '29 <tspan fill="#71717A">&#8226;</tspan> MANIPAL UNIVERSITY JAIPUR <tspan fill="#71717A">&#8226;</tspan> INDIA
      </text>
    </g>

    <!-- Navigation Quick Links (Right Aligned) -->
    <g transform="translate(620, 15)">
      <!-- Portfolio -->
      <g transform="translate(0, 0)">
        <rect width="115" height="34" fill="#141923" stroke="#4C8DFF" stroke-width="1.2" rx="4" />
        <circle cx="15" cy="17" r="3" fill="#4C8DFF" />
        <text x="27" y="22" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#F4F4F5">PORTFOLIO</text>
      </g>
      <!-- LinkedIn -->
      <g transform="translate(125, 0)">
        <rect width="105" height="34" fill="#141923" stroke="#222C3A" rx="4" />
        <text x="52" y="22" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#A1A1AA" text-anchor="middle">LINKEDIN</text>
      </g>
      <!-- Email -->
      <g transform="translate(240, 0)">
        <rect width="90" height="34" fill="#141923" stroke="#222C3A" rx="4" />
        <text x="45" y="22" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#A1A1AA" text-anchor="middle">CONTACT</text>
      </g>
    </g>
  </g>
</svg>