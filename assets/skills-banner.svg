<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 130" width="100%" height="100%">
  <defs>
    <linearGradient id="sk-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10151E" />
      <stop offset="100%" stop-color="#090C10" />
    </linearGradient>
  </defs>

  <rect width="1200" height="130" rx="8" fill="url(#sk-bg)" stroke="#1F2937" stroke-width="1.2" />

  <g transform="translate(40, 26)">
    <circle cx="0" cy="0" r="4" fill="#00E5FF" />
    <text x="14" y="4" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="700" fill="#00E5FF" letter-spacing="1.5">STACK &amp; CORE SYSTEMS</text>
  </g>

  <!-- Tech Badges Flow (Compact, Elegant, No Badge Walls) -->
  <g transform="translate(40, 56)">
    <!-- Python -->
    <g transform="translate(0, 0)">
      <rect width="105" height="38" fill="#131922" stroke="#253244" rx="4" />
      <text x="52" y="23" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#F1F3F5" text-anchor="middle">Python</text>
    </g>
    <!-- TypeScript -->
    <g transform="translate(120, 0)">
      <rect width="125" height="38" fill="#131922" stroke="#253244" rx="4" />
      <text x="62" y="23" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00E5FF" text-anchor="middle">TypeScript</text>
    </g>
    <!-- JavaScript -->
    <g transform="translate(260, 0)">
      <rect width="120" height="38" fill="#131922" stroke="#253244" rx="4" />
      <text x="60" y="23" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#F1F3F5" text-anchor="middle">JavaScript</text>
    </g>
    <!-- React / Next.js -->
    <g transform="translate(395, 0)">
      <rect width="145" height="38" fill="#131922" stroke="#253244" rx="4" />
      <text x="72" y="23" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#F1F3F5" text-anchor="middle">React / Next.js</text>
    </g>
    <!-- FastAPI -->
    <g transform="translate(555, 0)">
      <rect width="105" height="38" fill="#131922" stroke="#253244" rx="4" />
      <text x="52" y="23" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00E5FF" text-anchor="middle">FastAPI</text>
    </g>
    <!-- PostgreSQL -->
    <g transform="translate(675, 0)">
      <rect width="130" height="38" fill="#131922" stroke="#253244" rx="4" />
      <text x="65" y="23" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#F1F3F5" text-anchor="middle">PostgreSQL</text>
    </g>
    <!-- Docker -->
    <g transform="translate(820, 0)">
      <rect width="100" height="38" fill="#131922" stroke="#253244" rx="4" />
      <text x="50" y="23" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#F1F3F5" text-anchor="middle">Docker</text>
    </g>
    <!-- AWS -->
    <g transform="translate(935, 0)">
      <rect width="85" height="38" fill="#131922" stroke="#FF2A55" stroke-width="1.2" rx="4" />
      <text x="42" y="23" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#FF2A55" text-anchor="middle">AWS</text>
    </g>
    <!-- Git -->
    <g transform="translate(1035, 0)">
      <rect width="85" height="38" fill="#131922" stroke="#253244" rx="4" />
      <text x="42" y="23" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#B9C2CC" text-anchor="middle">Git</text>
    </g>
