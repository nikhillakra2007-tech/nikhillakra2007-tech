<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" width="100%" height="100%">
  <defs>
    <linearGradient id="diagBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#0e131d" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "SF Mono", Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .node-title { font-size: 11.5px; font-weight: 700; fill: #f0f6fc; letter-spacing: 0.08em; }
    .node-desc { font-size: 10px; fill: #8b949e; line-height: 1.4; }
  </style>

  <!-- Container -->
  <rect width="900" height="180" rx="6" fill="url(#diagBg)" stroke="#30363d" stroke-width="1" />

  <!-- Flow Nodes (4 Columns) -->
  <g transform="translate(32, 28)">
    
    <!-- Step 1 -->
    <g transform="translate(0, 0)">
      <rect width="186" height="124" rx="4" fill="#161b22" stroke="#30363d" stroke-width="0.8" />
      <rect width="186" height="24" rx="4" fill="#21262d" />
      <text x="12" y="16" class="mono" font-size="9.5" fill="#58a6ff" font-weight="600">01 // INVARIANTS</text>
      
      <text x="12" y="48" class="mono node-title">Mathematical Boundaries</text>
      <text x="12" y="68" class="sans node-desc">Exact arbitrary-precision Decimal</text>
      <text x="12" y="82" class="sans node-desc">arithmetic to guarantee zero-sum</text>
      <text x="12" y="96" class="sans node-desc">balance sheet reconciliation.</text>
    </g>

    <!-- Connector 1 -> 2 -->
    <line x1="186" y1="62" x2="216" y2="62" stroke="#388bfd" stroke-width="1.2" stroke-dasharray="3 2" />
    <polygon points="216,59 222,62 216,65" fill="#388bfd" />

    <!-- Step 2 -->
    <g transform="translate(222, 0)">
      <rect width="186" height="124" rx="4" fill="#161b22" stroke="#388bfd" stroke-width="0.8" />
      <rect width="186" height="24" rx="4" fill="#21262d" />
      <text x="12" y="16" class="mono" font-size="9.5" fill="#79c0ff" font-weight="600">02 // VERIFICATION</text>
      
      <text x="12" y="48" class="mono node-title">Deterministic Gates</text>
      <text x="12" y="68" class="sans node-desc">Generative models propose</text>
      <text x="12" y="82" class="sans node-desc">mutations; compiler AST passes</text>
      <text x="12" y="96" class="sans node-desc">and test harnesses hold veto.</text>
    </g>

    <!-- Connector 2 -> 3 -->
    <line x1="408" y1="62" x2="438" y2="62" stroke="#388bfd" stroke-width="1.2" stroke-dasharray="3 2" />
    <polygon points="438,59 444,62 438,65" fill="#388bfd" />

    <!-- Step 3 -->
    <g transform="translate(444, 0)">
      <rect width="186" height="124" rx="4" fill="#161b22" stroke="#30363d" stroke-width="0.8" />
      <rect width="186" height="24" rx="4" fill="#21262d" />
      <text x="12" y="16" class="mono" font-size="9.5" fill="#3fb950" font-weight="600">03 // PROVENANCE</text>
      
      <text x="12" y="48" class="mono node-title">Differential Evidence</text>
      <text x="12" y="68" class="sans node-desc">Twin baselines under identical</text>
      <text x="12" y="82" class="sans node-desc">stress conditions to isolate failures</text>
      <text x="12" y="96" class="sans node-desc">rather than aggregate guesswork.</text>
    </g>

    <!-- Connector 3 -> 4 -->
    <line x1="630" y1="62" x2="660" y2="62" stroke="#388bfd" stroke-width="1.2" stroke-dasharray="3 2" />
    <polygon points="660,59 666,62 660,65" fill="#388bfd" />

    <!-- Step 4 -->
    <g transform="translate(666, 0)">
      <rect width="170" height="124" rx="4" fill="#161b22" stroke="#30363d" stroke-width="0.8" />
      <rect width="170" height="24" rx="4" fill="#21262d" />
      <text x="12" y="16" class="mono" font-size="9.5" fill="#d29922" font-weight="600">04 // PRODUCTION</text>
      
      <text x="12" y="48" class="mono node-title">Shipped Systems</text>
      <text x="12" y="68" class="sans node-desc">Complete user-facing products</text>
      <text x="12" y="82" class="sans node-desc">with IaC reproducibility,</text>
      <text x="12" y="96" class="sans node-desc">latency bounds, and clean UX.</text>
    </g>

  </g>
</svg>

