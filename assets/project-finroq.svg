<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="fin-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111622" />
      <stop offset="100%" stop-color="#0B0E14" />
    </linearGradient>
    <pattern id="fin-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#161F2C" stroke-width="0.6" />
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="8" fill="url(#fin-bg)" stroke="#1F2937" stroke-width="1.2" />
  <rect width="1200" height="320" rx="8" fill="url(#fin-grid)" opacity="0.6" />

  <!-- Diagonal Manga Shading Accent -->
  <polygon points="780,0 860,0 740,320 660,320" fill="#151D2A" opacity="0.5" />
  <line x1="860" y1="0" x2="740" y2="320" stroke="#00E5FF" stroke-width="1" opacity="0.25" />

  <!-- Corner Brackets -->
  <path d="M 24 16 L 24 8 L 32 8" fill="none" stroke="#00E5FF" stroke-width="1.5" />
  <path d="M 1176 16 L 1176 8 L 1168 8" fill="none" stroke="#00E5FF" stroke-width="1.5" />
  <path d="M 24 304 L 24 312 L 32 312" fill="none" stroke="#00E5FF" stroke-width="1.5" />
  <path d="M 1176 304 L 1176 312 L 1168 312" fill="none" stroke="#00E5FF" stroke-width="1.5" />

  <!-- Header Category -->
  <g transform="translate(48, 38)">
    <circle cx="0" cy="0" r="4" fill="#00E5FF" />
    <text x="14" y="4" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="700" fill="#00E5FF" letter-spacing="1.5">PROJECT 01 // FINANCIAL INTELLIGENCE</text>
  </g>
  <g transform="translate(1152, 38)">
    <text x="0" y="4" font-family="'JetBrains Mono', monospace" font-size="10" fill="#FF2A55" font-weight="700" text-anchor="end">INVARIANT: ZERO FLOAT DRIFT</text>
  </g>

  <!-- Left: Content & Positioning -->
  <g transform="translate(48, 85)">
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="900" fill="#F1F3F5" letter-spacing="-0.5">FINROQ</text>
    <rect x="175" y="8" width="135" height="24" fill="#151D28" stroke="#253549" rx="3" />
    <text x="242" y="24" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#00E5FF" text-anchor="middle">FINANCIAL KERNEL</text>

    <text x="0" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" fill="#B9C2CC">
      <tspan x="0" dy="0">Arbitrary-precision double-entry core built on Python Decimal.</tspan>
      <tspan x="0" dy="22">Enforces exact ledger balancing and mathematical invariants with zero float rounding drift.</tspan>
    </text>

    <!-- Badges Row -->
    <g transform="translate(0, 130)">
      <rect x="0" y="0" width="145" height="30" fill="#111720" stroke="#1F2C3C" rx="4" />
      <text x="14" y="19" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#00E5FF" font-weight="600">177 UNIT TESTS</text>

      <rect x="155" y="0" width="150" height="30" fill="#111720" stroke="#1F2C3C" rx="4" />
      <text x="169" y="19" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#B9C2CC" font-weight="600">31 ENGINE TESTS</text>

      <rect x="315" y="0" width="165" height="30" fill="#111720" stroke="#1F2C3C" rx="4" />
      <text x="329" y="19" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#FF2A55" font-weight="600">DOUBLE-ENTRY LEDGER</text>
    </g>
  </g>

  <!-- Right: Invariant Terminal Panel -->
  <g transform="translate(680, 80)">
    <rect width="470" height="195" fill="#0A0E14" stroke="#1E2A3A" rx="5" />
    <rect width="470" height="26" fill="#121822" rx="5" />
    <circle cx="14" cy="13" r="3.5" fill="#00E5FF" />
    <text x="26" y="17" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#F1F3F5">LEDGER ATOMIC SPECIFICATION</text>
    <text x="456" y="17" font-family="'JetBrains Mono', monospace" font-size="8" fill="#58697D" text-anchor="end">STATUS: VERIFIED</text>

    <g transform="translate(20, 48)">
      <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#5D6E82">// STRICT ACCOUNTING IDENTITY</text>
      <text x="0" y="24" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#F1F3F5">&#8721; Assets == &#8721; Liabilities + &#8721; Equity</text>
      
      <text x="0" y="52" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#00E5FF">Decimal('0.10') * 3 == Decimal('0.30')</text>
      <text x="0" y="74" font-family="'JetBrains Mono', monospace" font-size="10" fill="#9AA4B2">IEEE 754 Float: 0.30000000000000004 &#8594; <tspan fill="#FF2A55">REJECTED</tspan></text>
      
      <line x1="0" y1="92" x2="430" y2="92" stroke="#192330" stroke-width="1" />
      <text x="0" y="112" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#00E5FF">RECONCILIATION ENGINE: ZERO DRIFT &amp;bull; 100% INVARIANT PASS</text>
    </g>
  </g>
</svg>