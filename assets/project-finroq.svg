<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <linearGradient id="fin-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11161F" />
      <stop offset="100%" stop-color="#0C0F14" />
    </linearGradient>
    <pattern id="fin-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#161D26" stroke-width="0.7" />
    </pattern>
  </defs>

  <rect width="1200" height="480" rx="8" fill="url(#fin-bg)" stroke="#1F2937" stroke-width="1.2" />
  <rect width="1200" height="480" rx="8" fill="url(#fin-grid)" opacity="0.55" />

  <rect x="0" y="0" width="1200" height="52" fill="#141B24" rx="8" />
  <path d="M 0 44 L 1200 44" stroke="#222D3D" stroke-width="1" />

  <path d="M 24 16 L 24 8 L 32 8" fill="none" stroke="#39D5E8" stroke-width="1.5" />
  <path d="M 1176 16 L 1176 8 L 1168 8" fill="none" stroke="#39D5E8" stroke-width="1.5" />

  <g transform="translate(40, 28)">
    <circle cx="0" cy="0" r="4" fill="#39D5E8" />
    <text x="14" y="4" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#39D5E8" letter-spacing="1.5">PROJECT 01 // FINANCIAL INTELLIGENCE</text>
    <text x="480" y="4" font-family="'JetBrains Mono', monospace" font-size="10" fill="#627182">ARBITRARY-PRECISION FIXED POINT ENGINE</text>
  </g>

  <g transform="translate(1160, 28)">
    <text x="0" y="4" font-family="'JetBrains Mono', monospace" font-size="10" fill="#FF784F" font-weight="600" text-anchor="end">INVARIANT: ZERO FLOAT DRIFT</text>
  </g>

  <g transform="translate(50, 90)">
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="36" font-weight="800" fill="#F1F3F5" letter-spacing="-0.5">FINROQ</text>
    <rect x="170" y="8" width="140" height="24" fill="#17202B" stroke="#2C3C4F" rx="3" />
    <text x="240" y="24" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#39D5E8" text-anchor="middle">FINANCIAL KERNEL</text>

    <text x="0" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" fill="#B9C2CC">
      <tspan x="0" dy="0">Precision-engineered double-entry core built on Python Decimal.</tspan>
      <tspan x="0" dy="24">Enforces zero float drift and strict accounting invariants across</tspan>
      <tspan x="0" dy="24">all transaction ledgers, balance sheets and equity mutations.</tspan>
    </text>

    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="155" height="32" fill="#131A23" stroke="#222E3D" rx="4" />
      <text x="14" y="20" font-family="'JetBrains Mono', monospace" font-size="10" fill="#39D5E8" font-weight="600">177 UNIT TESTS</text>

      <rect x="165" y="0" width="165" height="32" fill="#131A23" stroke="#222E3D" rx="4" />
      <text x="179" y="20" font-family="'JetBrains Mono', monospace" font-size="10" fill="#B9C2CC" font-weight="600">31 ENGINE TESTS</text>

      <rect x="340" y="0" width="150" height="32" fill="#131A23" stroke="#222E3D" rx="4" />
      <text x="354" y="20" font-family="'JetBrains Mono', monospace" font-size="10" fill="#FF784F" font-weight="600">STRICT PARITY</text>
    </g>

    <g transform="translate(0, 215)">
      <rect width="490" height="125" fill="#0D1218" stroke="#1F2B3A" rx="4" />
      <text x="16" y="24" font-family="'JetBrains Mono', monospace" font-size="9" fill="#627284">// ENGINE INVARIANT VERIFICATION</text>
      <text x="16" y="48" font-family="'JetBrains Mono', monospace" font-size="11" fill="#F1F3F5">&#8721; Assets == &#8721; Liabilities + &#8721; Equity</text>
      <text x="16" y="72" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#39D5E8">Decimal('0.10') * 3 == Decimal('0.30')</text>
      <text x="16" y="94" font-family="'JetBrains Mono', monospace" font-size="10" fill="#9AA4B2">IEEE 754 Float: 0.30000000000000004 &#8594; <tspan fill="#FF784F">REJECTED</tspan></text>
      <line x1="16" y1="106" x2="474" y2="106" stroke="#1B2635" stroke-width="1" />
      <text x="16" y="118" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#516173">ASSERTION_STATUS: 100% INVARIANT ENFORCEMENT</text>
    </g>
  </g>

  <!-- Right Column: Precision Ledger Diagram -->
  <g transform="translate(590, 85)">
    <rect width="560" height="355" fill="#10151C" stroke="#222E3D" rx="6" />

    <rect width="560" height="32" fill="#151C26" rx="6" />
    <path d="M 0 32 L 560 32" stroke="#222E3D" stroke-width="1" />
    <circle cx="18" cy="16" r="3.5" fill="#39D5E8" />
    <text x="32" y="20" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#F1F3F5">DOUBLE-ENTRY LEDGER FLOW // ATOMIC MUTATION</text>
    <text x="542" y="20" font-family="'JetBrains Mono', monospace" font-size="9" fill="#5A697A" text-anchor="end">RECONCILIATION ENGINE</text>

    <!-- Node 1 -->
    <g transform="translate(30, 60)">
      <rect width="145" height="90" fill="#141B24" stroke="#253446" rx="4" />
      <rect width="145" height="20" fill="#19232F" rx="4" />
      <text x="10" y="14" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#39D5E8">01. INGESTION</text>
      <text x="10" y="38" font-family="'JetBrains Mono', monospace" font-size="9" fill="#B9C2CC">Tx Payload</text>
      <text x="10" y="54" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#6E7D8F">Quantize(0.0001)</text>
      <text x="10" y="72" font-family="'JetBrains Mono', monospace" font-size="8" fill="#39D5E8">Arbitrary Prec.</text>
    </g>

    <path d="M 180 105 L 210 105" stroke="#39D5E8" stroke-width="1.5" stroke-dasharray="2,2" />
    <polygon points="210,105 204,101 204,109" fill="#39D5E8" />

    <!-- Node 2 -->
    <g transform="translate(215, 50)">
      <rect width="155" height="110" fill="#161F2A" stroke="#39D5E8" stroke-width="1.2" rx="4" />
      <rect width="155" height="22" fill="#1B2735" rx="4" />
      <text x="10" y="15" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#F1F3F5">02. DUAL BALANCING</text>
      <text x="10" y="42" font-family="'JetBrains Mono', monospace" font-size="9" fill="#39D5E8">Debit: Asset (+A)</text>
      <text x="10" y="58" font-family="'JetBrains Mono', monospace" font-size="9" fill="#FF784F">Credit: Liab (+L)</text>
      <line x1="10" y1="70" x2="145" y2="70" stroke="#263546" stroke-width="1" />
      <text x="10" y="86" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#B9C2CC">&#916; Balance == 0.00</text>
      <text x="10" y="100" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#556678">ZERO ROUNDING LEAK</text>
    </g>

    <path d="M 375 105 L 405 105" stroke="#39D5E8" stroke-width="1.5" stroke-dasharray="2,2" />
    <polygon points="405,105 399,101 399,109" fill="#39D5E8" />

    <!-- Node 3 -->
    <g transform="translate(410, 60)">
      <rect width="125" height="90" fill="#141B24" stroke="#253446" rx="4" />
      <rect width="125" height="20" fill="#19232F" rx="4" />
      <text x="10" y="14" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#39D5E8">03. SETTLEMENT</text>
      <text x="10" y="38" font-family="'JetBrains Mono', monospace" font-size="9" fill="#B9C2CC">Append-Only</text>
      <text x="10" y="54" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#6E7D8F">Audit Journal</text>
      <text x="10" y="72" font-family="'JetBrains Mono', monospace" font-size="8" fill="#FF784F">Immutable Record</text>
    </g>

    <!-- Bottom Metrics Console -->
    <g transform="translate(25, 185)">
      <rect width="510" height="145" fill="#0D1217" stroke="#1F2B38" rx="4" />
      <text x="16" y="22" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#8B9BAE">DIAGNOSTIC METRIC CHANNELS</text>

      <g transform="translate(16, 36)">
        <text x="0" y="12" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#B9C2CC">Math Engine Drift:</text>
        <rect x="160" y="2" width="230" height="12" fill="#18212C" rx="2" />
        <rect x="160" y="2" width="230" height="12" fill="#39D5E8" rx="2" opacity="0.9" />
        <text x="400" y="12" font-family="'JetBrains Mono', monospace" font-size="9" fill="#39D5E8" font-weight="700">0.0000000000 (EXACT)</text>
      </g>

      <g transform="translate(16, 62)">
        <text x="0" y="12" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#B9C2CC">Invariant Enforcement:</text>
        <rect x="160" y="2" width="230" height="12" fill="#18212C" rx="2" />
        <rect x="160" y="2" width="230" height="12" fill="#39D5E8" rx="2" opacity="0.9" />
        <text x="400" y="12" font-family="'JetBrains Mono', monospace" font-size="9" fill="#39D5E8" font-weight="700">100% (177/177 PASSED)</text>
      </g>

      <g transform="translate(16, 88)">
        <text x="0" y="12" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#B9C2CC">Core Verification Speed:</text>
        <rect x="160" y="2" width="230" height="12" fill="#18212C" rx="2" />
        <rect x="160" y="2" width="205" height="12" fill="#FF784F" rx="2" opacity="0.85" />
        <text x="400" y="12" font-family="'JetBrains Mono', monospace" font-size="9" fill="#FF784F" font-weight="700">&lt; 14ms PER BATCH</text>
      </g>

      <line x1="16" y1="112" x2="494" y2="112" stroke="#1B2633" stroke-width="1" />
      <text x="16" y="128" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#5A6878">SPEC: STRICT DUAL-ENTRY PROTOCOL // PRODUCTION VERIFIED</text>
    </g>
  </g>
</svg>